}

function isTyping() {
  const active = document.activeElement;
  return !!active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT' || active.isContentEditable);
}

function downloadBlob(content, filename, mime) {
  try {
    const blob = new Blob([content], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  } catch (err) {
    console.error('Download non riuscito', err);
    showToast('Download non riuscito su questo browser.', 'err');
  }
}

function readFileText(file) {
  if (file && typeof file.text === 'function') return file.text();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(new Error('Lettura del file non riuscita'));
    reader.readAsText(file, 'utf-8');
  });
}

function haversineKm(a, b) {
  if (!a || !b) return 0;
  const R = 6371;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);
  const lat1 = toRad(a.lat);
  const lat2 = toRad(b.lat);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

function centroidOfPeople(people) {
  const coords = people.map(p => geoCoord(p)).filter(Boolean);
  if (!coords.length) return null;
  return {
    lat: coords.reduce((sum, c) => sum + c.lat, 0) / coords.length,
    lon: coords.reduce((sum, c) => sum + c.lon, 0) / coords.length
  };
}

/* ==========================================================================
   3. PARSER CSV ROBUSTO
   ==========================================================================
   - Rimuove il BOM (EF BB BF) dal primo campo.
   - Supporta campi tra doppi apici, virgole/apici interni e "" come escape.
   - Rileva il separatore: se la prima riga ha più ";" che ",", usa ";".
   - Gestisce fine riga \n, \r\n e campi con newline interni.
   ========================================================================== */
function stripBOM(text) {
  return text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
}

function detectDelimiter(text) {
  const firstLine = String(text).split(/\r?\n/, 1)[0] || '';
  let inQuotes = false;
  let commas = 0;
  let semicolons = 0;
  for (let i = 0; i < firstLine.length; i++) {
    const ch = firstLine[i];
    if (ch === '"') inQuotes = !inQuotes;
    else if (!inQuotes && ch === ',') commas++;
    else if (!inQuotes && ch === ';') semicolons++;
  }
  return semicolons > commas ? ';' : ',';
}

function parseCSV(text) {
  const source = stripBOM(String(text || ''));
  const delimiter = detectDelimiter(source);
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < source.length; i++) {
    const ch = source[i];
    if (inQuotes) {
      if (ch === '"') {
        if (source[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === delimiter) {
      row.push(field);
      field = '';
    } else if (ch === '\n') {
      row.push(field);
      field = '';
      rows.push(row);
      row = [];
    } else if (ch === '\r') {
      // gestito insieme a \r\n: il \n successivo chiuderà la riga
    } else {
      field += ch;
    }
  }
  if (field.length || row.length) {
    row.push(field);
    rows.push(row);
  }
  const cleanedRows = rows.filter(r => r.some(cell => clean(cell) !== ''));
  return { rows: cleanedRows, delimiter };
}

function validateCSV(parsed) {
  if (!parsed.rows.length) throw new Error('Il file CSV è vuoto.');
  const header = parsed.rows[0].map(h => clean(h));
  const required = ['Codice Paziente', 'Descrizione Paziente', 'Indirizzo', 'Città', 'CAP', 'Telefono'];
  const missing = required.filter(name => !header.includes(name));
  if (missing.length) throw new Error('Colonne mancanti: ' + missing.join(', '));
  return header;
}

function rowsFromParsed(parsed, header) {
  const rows = [];
  for (let i = 1; i < parsed.rows.length; i++) {
    const values = parsed.rows[i];
    if (!values.some(v => clean(v) !== '')) continue;
    const row = {};
    header.forEach((name, index) => {
      if (name) row[name] = values[index] !== undefined ? values[index] : '';
    });
    rows.push(row);
  }
  return rows;
}

/* ==========================================================================
   4. MODELLO PERSONE / DISPOSITIVI
   ========================================================================== */
function patientCode(row) {
  const raw = clean(row['Codice Paziente']);
  if (raw) return raw;
  return 'NOPAZ-' + hashString(clean(row['Descrizione Paziente']) + '|' + normAddress(row['Indirizzo']));
}

function buildPeople() {
  state.people = new Map();
  state.personList = [];
  state.meta = { cityCaps: new Map(), capCities: new Map(), hasUppercaseCity: false };

  for (const row of state.rows) {
    const code = patientCode(row);
    let person = state.people.get(code);
    const rawCity = clean(row['Città']);
    const address = normAddress(row['Indirizzo']);

    if (!person) {
      person = {
        code,
        nome: formatName(row['Descrizione Paziente']) || 'Paziente senza nome',
        nomeRaw: clean(row['Descrizione Paziente']),
        cf: clean(row['Codice Fiscale Paziente']),
        cliente: clean(row['Ragione Sociale Cliente']),
        codiceCliente: clean(row['Codice Cliente']),
        telefono: normalizePhone(row['Telefono']),
        telefonoRaw: clean(row['Telefono']),
        secondari: [],
        indirizzo: address,
        indirizzoRaw: clean(row['Indirizzo']),
        citta: titleCaseCity(rawCity),
        cittaRaw: rawCity,
        cap: clean(row['CAP']),
        indirizzoOriginale: address,
        cittaOriginale: titleCaseCity(rawCity),
        capOriginale: clean(row['CAP']),
        rows: [],
        dispositivi: [],
        noteIntervento: '',
        noteOperatore: '',
        stato: 'da_contattare',
        giornoAppuntamento: '',
        dataUltimoContatto: '',
        fuoriZona: false,
        modificato: false,
        indirizzoPrecedente: '',
        dataModificaIndirizzo: '',
        motivoModifica: '',
        log: [],
        telSospetto: false,
        telMancante: false,
        capSospetto: false,
        indirizzoIncerto: false,
        indirizzoProblemi: []
      };
      person._deviceKeys = new Set();
      person._noteSet = new Set();
      state.people.set(code, person);
      state.personList.push(person);
    }

    person.rows.push(row);

    const note = clean(row['Note Intervento']);
    if (note && !person._noteSet.has(note)) {
      person._noteSet.add(note);
      person.noteIntervento = person.noteIntervento ? person.noteIntervento + '\n' + note : note;
    }

    /* Se la prima riga ha campi vuoti, completa da righe successive. */
    if (!person.telefono) person.telefono = normalizePhone(row['Telefono']);
    if (!person.indirizzo && address) {
      person.indirizzo = address;
      person.indirizzoOriginale = address;
      person.indirizzoRaw = clean(row['Indirizzo']);
    }
    if (!person.citta && rawCity) {
      person.citta = titleCaseCity(rawCity);
      person.cittaOriginale = person.citta;
      person.cittaRaw = rawCity;
    }
    if (!person.cap) {
      person.cap = clean(row['CAP']);
      person.capOriginale = person.cap;
    }

    const device = {
      workOrder: clean(row['Work Order']),
      idAttivita: clean(row['ID attività']),
      data: clean(row['Data']),
      statoAttivita: clean(row['Stato attività']),
      tipo: clean(row['Tipo di attività']),
      modello: clean(row['Modello']),
      descrizioneModello: clean(row['Descrizione Modello']),
      asset: clean(row['Asset da Prelevare']),
      descrizionePdC: clean(row['Descrizione PdC']),
      codicePdC: clean(row['Codice PdC']),
      materiale: clean(row['Materiale Prelevabile da'])
    };
    const deviceKey = [device.workOrder, device.asset, device.modello].join('|') || String(person.rows.length);
    if (!person._deviceKeys.has(deviceKey)) {
      person._deviceKeys.add(deviceKey);
      person.dispositivi.push(device);
    }
  }

  for (const person of state.personList) {
    person.secondari = extractSecondaryPhones(person.noteIntervento, person.telefono);
    const ck = cityKey(person.citta);
    if (ck && person.cap) {
      if (!state.meta.cityCaps.has(ck)) state.meta.cityCaps.set(ck, new Set());
      state.meta.cityCaps.get(ck).add(person.cap);
      if (isValidCap(person.cap)) {
        if (!state.meta.capCities.has(person.cap)) state.meta.capCities.set(person.cap, new Set());
        state.meta.capCities.get(person.cap).add(ck);
      }
    }
    if (/[A-ZÀ-ÖØ-Þ]/.test(person.cittaRaw)) state.meta.hasUppercaseCity = true;
    if (phoneIsSuspicious(person.telefono)) person.telSospetto = true;
  }
}

function applyEsiti() {
  for (const person of state.personList) {
    const saved = state.esiti[person.code];
    if (!saved || typeof saved !== 'object') continue;

    if (STATES[saved.stato]) person.stato = saved.stato;
    person.giornoAppuntamento = clean(saved.giornoAppuntamento);
    person.dataUltimoContatto = clean(saved.dataUltimoContatto);
    person.noteOperatore = typeof saved.noteOperatore === 'string' ? saved.noteOperatore : '';
    person.fuoriZona = !!saved.fuoriZona;
    if (person.stato === 'fuori_zona' || person.stato === 'cambio_fuori') person.fuoriZona = true;
    if (person.stato !== 'appuntamento') person.giornoAppuntamento = '';
    person.log = Array.isArray(saved.log) ? saved.log : [];

    if (saved.modificato) {
      if (typeof saved.indirizzo === 'string') person.indirizzo = normAddress(saved.indirizzo);
      if (typeof saved.citta === 'string') person.citta = titleCaseCity(saved.citta);
      if (typeof saved.cap === 'string') person.cap = clean(saved.cap);
      if (typeof saved.indirizzoRaw === 'string') person.indirizzoRaw = saved.indirizzoRaw;
      if (typeof saved.cittaRaw === 'string') person.cittaRaw = saved.cittaRaw;
      person.modificato = true;
      person.indirizzoPrecedente = clean(saved.indirizzoPrecedente);
      person.dataModificaIndirizzo = clean(saved.dataModificaIndirizzo);
      person.motivoModifica = clean(saved.motivoModifica);
    }

    if (person.fuoriZona && !DONE_STATES.has(person.stato)) person.stato = 'fuori_zona';
  }
}

function computeFlags() {
  for (const person of state.personList) {
    person.telMancante = !person.telefono;
    person.telSospetto = phoneIsSuspicious(person.telefono);
    person.capSospetto = !isValidCap(person.cap);

    const issues = [];
    if (!person.indirizzo) issues.push('Indirizzo mancante');
    if (!person.citta) issues.push('Città mancante');
    if (person.capSospetto) issues.push('CAP non di 5 cifre');

    const ck = cityKey(person.citta);
    if (isValidCap(person.cap) && ck && state.meta.cityCaps.has(ck)) {
      const caps = state.meta.cityCaps.get(ck);
      if (caps.size && !caps.has(person.cap)) {
        issues.push('CAP ' + person.cap + ' non coerente con ' + person.citta);
      }
    }

    if (/^(loc\.?|località|localita|sp\.?|spiaggia)\b/i.test(person.indirizzo) && !/\d/.test(person.indirizzo)) {
      issues.push('Località senza civico');
    }

    if (state.meta.hasUppercaseCity && person.cittaRaw && /[a-zà-ÿ]/.test(person.cittaRaw) && person.cittaRaw === person.cittaRaw.toLowerCase()) {
      issues.push('Città scritta in minuscolo');
    }

    const geo = getGeoEntry(person);
    if (geo && geo.notFound) issues.push('Geocoding senza risultati');

    person.indirizzoProblemi = issues;
    person.indirizzoIncerto = issues.length > 0;
    person.geo = geoCoord(person);
  }

  /* Conteggio persone per indirizzo: serve al raggruppamento visivo e al badge. */
  const addressCounts = new Map();
  for (const person of state.personList) {
    if (!person.indirizzo) continue;
    const key = personAddressKey(person);
    addressCounts.set(key, (addressCounts.get(key) || 0) + 1);
  }
  state.meta.addressCounts = addressCounts;
}

function getPerson(code) {
  return state.people.get(code) || null;
}

function isDone(person) {
  return !!person && (DONE_STATES.has(person.stato) || person.fuoriZona);
}

function eligiblePeople() {
  const tomorrow = tomorrowISO();
  return state.personList.filter(person => {
    if (!person || isDone(person)) return false;
    if (!ELIGIBLE_STATES.has(person.stato)) return false;
    if (state.domani.includes(person.code)) return false;
    if (state.oggi.includes(person.code)) return false;
    if (person.stato === 'appuntamento' && person.giornoAppuntamento && person.giornoAppuntamento !== tomorrow) return false;
    return true;
  });
}

function selectedPeople() {
  return state.domani.map(code => getPerson(code)).filter(Boolean);
}

function personAddressKey(person) {
  if (!person || !person.indirizzo) return 'zz|' + (person ? person.code : Math.random());
  return [normAddress(person.indirizzo).toLowerCase(), clean(person.cap), cityKey(person.citta)].join('|');
}

function shortAddress(person) {
  const place = [clean(person.cap), clean(person.citta)].filter(Boolean).join(' ');
  return [clean(person.indirizzo), place].filter(Boolean).join(', ');
}

function isIOSDevice() {
  const ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function mapsUrl(person) {
  const query = [clean(person.indirizzo), clean(person.cap), clean(person.citta), 'Italia'].filter(Boolean).join(', ');
  const base = isIOSDevice()
    ? 'https://maps.apple.com/?q='
    : 'https://www.google.com/maps/search/?api=1&query=';
  return base + encodeURIComponent(query);
}

function mapsLinkHtml(person, compact) {
  if (!person || !person.indirizzo) return '';
  const url = mapsUrl(person);
  const label = 'Apri in Maps: ' + shortAddress(person);
  if (compact) {
    return '<a class="btn btn-sm btn-map" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(label) + '" title="' + esc(label) + '">' + ICON.map + '</a>';
  }
  return '<a class="maps-link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(label) + '">' + ICON.map + '<span>Apri in Maps</span><span class="maps-ext" aria-hidden="true">↗</span></a>';
}

/* ==========================================================================
   5. PERSISTENZA LOCALE (iOS file:// può bloccare localStorage)
   ========================================================================== */
function storageTest() {
  try {
    const key = '__ritiri_test__';
    localStorage.setItem(key, '1');
    const value = localStorage.getItem(key);
    localStorage.removeItem(key);
    return value === '1';
  } catch (err) {
    return false;
  }
}

function loadLocalState() {
  try {
    state.rawCsv = localStorage.getItem(STORAGE_KEYS.csv) || '';
    state.esiti = parseJSON(localStorage.getItem(STORAGE_KEYS.esiti), {});
    state.geocache = parseJSON(localStorage.getItem(STORAGE_KEYS.geo), {});
    state.osrmcache = parseJSON(localStorage.getItem(STORAGE_KEYS.osrm), {});
    state.oggi = asStringArray(parseJSON(localStorage.getItem(STORAGE_KEYS.oggi), []));
    state.domani = asStringArray(parseJSON(localStorage.getItem(STORAGE_KEYS.domani), []));
    const settings = parseJSON(localStorage.getItem(STORAGE_KEYS.settings), {});
    if (settings && typeof settings === 'object') state.settings = Object.assign({ raggruppa: true }, settings);
  } catch (err) {
    console.warn('Lettura localStorage non riuscita', err);
  }
  if (!state.esiti || typeof state.esiti !== 'object' || Array.isArray(state.esiti)) state.esiti = {};
  if (!state.geocache || typeof state.geocache !== 'object' || Array.isArray(state.geocache)) state.geocache = {};
  if (!state.osrmcache || typeof state.osrmcache !== 'object' || Array.isArray(state.osrmcache)) state.osrmcache = {};
}

function writeCoreStorage() {
  localStorage.setItem(STORAGE_KEYS.csv, state.rawCsv);
  localStorage.setItem(STORAGE_KEYS.esiti, JSON.stringify(state.esiti));
  localStorage.setItem(STORAGE_KEYS.geo, JSON.stringify(state.geocache));
  localStorage.setItem(STORAGE_KEYS.oggi, JSON.stringify(state.oggi));
  localStorage.setItem(STORAGE_KEYS.domani, JSON.stringify(state.domani));
  localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(state.settings));
}

function saveNow() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  if (!state.storageOK) return;
  trimOsrmCache();
  try {
    writeCoreStorage();
    localStorage.setItem(STORAGE_KEYS.osrm, JSON.stringify(state.osrmcache));
  } catch (err) {
    console.warn('localStorage pieno o non disponibile', err);
    try {
      state.osrmcache = {};
      localStorage.setItem(STORAGE_KEYS.osrm, '{}');
      writeCoreStorage();
    } catch (err2) {
      state.storageOK = false;
      updatePersistBanner();
      showToast('Persistenza locale non disponibile: usa Salva stato', 'warn');
    }
  }
}

function saveSoon() {
  if (!state.storageOK) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; saveNow(); }, 350);
}

function trimOsrmCache() {
  const entries = Object.entries(state.osrmcache)
    .filter(([, value]) => value && Array.isArray(value.matrix) && Array.isArray(value.order));
  entries.sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  const kept = {};
  entries.slice(0, 4).forEach(([key, value]) => { kept[key] = value; });
  state.osrmcache = kept;
}

function updatePersistBanner() {
  const banner = document.getElementById('persist-banner');
  if (!banner) return;
  banner.classList.toggle('hidden', state.storageOK);
  document.body.classList.toggle('storage-blocked', !state.storageOK);
}

function persistPerson(person) {
  if (!person) return;
  state.esiti[person.code] = {
    stato: person.stato,
    giornoAppuntamento: person.giornoAppuntamento || '',
    dataUltimoContatto: person.dataUltimoContatto || '',
    noteOperatore: person.noteOperatore || '',
    fuoriZona: !!person.fuoriZona,
    indirizzo: person.indirizzo,
    indirizzoRaw: person.indirizzoRaw,
    citta: person.citta,
    cittaRaw: person.cittaRaw,
    cap: person.cap,
    indirizzoOriginale: person.indirizzoOriginale,
    cittaOriginale: person.cittaOriginale,
    capOriginale: person.capOriginale,
    modificato: !!person.modificato,
    indirizzoPrecedente: person.indirizzoPrecedente || '',
    dataModificaIndirizzo: person.dataModificaIndirizzo || '',
    motivoModifica: person.motivoModifica || '',
    log: Array.isArray(person.log) ? person.log : []
  };
}

/* ==========================================================================
   6. PIANI GIORNALIERI
   ========================================================================== */
function syncPlans() {
  const seenDomani = new Set();
  state.domani = state.domani.filter(code => {
    const person = getPerson(code);
    if (!person || seenDomani.has(code) || isDone(person) || state.oggi.includes(code)) return false;
    seenDomani.add(code);
    return true;
  }).slice(0, TARGET);

  const seenOggi = new Set();
  state.oggi = state.oggi.filter(code => {
    const person = getPerson(code);
    if (!person || seenOggi.has(code)) return false;
    seenOggi.add(code);
    return true;
  });

  const tomorrow = tomorrowISO();
  for (const person of state.personList) {
    if (state.domani.length >= TARGET) break;
    if (person.stato === 'appuntamento' && person.giornoAppuntamento === tomorrow && !isDone(person)
      && !state.oggi.includes(person.code) && !state.domani.includes(person.code)) {
      state.domani.push(person.code);
    }
  }
}

function addToDomani(code, options) {
  const opts = options || {};
  const person = getPerson(code);
  if (!person || isDone(person)) return false;
  if (state.oggi.includes(code)) {
    if (!opts.silent) showToast('La persona è già nella giornata di Oggi.', 'warn');
    return false;
  }
  if (state.domani.includes(code)) return true;
  if (state.domani.length >= TARGET) {
    if (!opts.silent) showToast('Hai già selezionato 7 persone per domani.', 'warn');
    return false;
  }
  state.domani.push(code);
  if (!opts.silent) {
    saveSoon();
    render();
    showToast('Aggiunto a domani (' + state.domani.length + '/7).', 'ok');
  }
  return true;
}

function removeFromDomani(code, options) {
  const opts = options || {};
  const index = state.domani.indexOf(code);
  if (index < 0) return;
  state.domani.splice(index, 1);
  state.ui.sessionHandled.delete(code);
  const person = getPerson(code);
  if (opts.reset !== false && person && person.stato === 'appuntamento') {
    person.stato = 'da_contattare';
    person.giornoAppuntamento = '';
    person.dataUltimoContatto = nowISO();
    persistPerson(person);
  }
  if (!opts.silent) {
    saveSoon();
    computeFlags();
    render();
    scheduleOsrm();
    showToast('Persona rimossa da domani.', 'ok');
  }
}

function setAppointmentDate(code, date) {
  const person = getPerson(code);
  if (!person) return;
  person.stato = 'appuntamento';
  person.giornoAppuntamento = date || '';
  person.dataUltimoContatto = nowISO();
  if (date === tomorrowISO()) addToDomani(code, { silent: true });
  else if (state.domani.includes(code)) removeFromDomani(code, { silent: true, reset: false });
  persistPerson(person);
  markTouched(code);
  saveSoon();
  computeFlags();
  render();
  scheduleOsrm();
  showToast(date ? 'Appuntamento: ' + formatShortDate(date) : 'Data appuntamento rimossa.', 'ok');
}

function markTouched(code) {
  state.ui.lastTouched = code || null;
  if (!code) return;
  setTimeout(() => {
    if (state.ui.lastTouched === code) state.ui.lastTouched = null;
  }, 900);
}

function applyEsito(code, stato, options) {
  const opts = options || {};
  const person = getPerson(code);
  if (!person || !STATES[stato]) return;

  person.stato = stato;
  person.dataUltimoContatto = nowISO();

  if (stato === 'fuori_zona' || stato === 'cambio_fuori') person.fuoriZona = true;
  else person.fuoriZona = false;
  if (stato === 'da_contattare') person.giornoAppuntamento = '';
  if (stato === 'appuntamento') {
    if (opts.tomorrow) person.giornoAppuntamento = tomorrowISO();
    if (person.giornoAppuntamento === tomorrowISO() && !state.oggi.includes(code)) {
      addToDomani(code, { silent: true });
    }
  } else if (stato === 'non_risponde' || stato === 'da_richiamare' || stato === 'da_contattare' || DONE_STATES.has(stato)) {
    if (state.domani.includes(code)) removeFromDomani(code, { silent: true, reset: false });
  }

  if (stato === 'appuntamento' && state.domani.includes(code) && person.giornoAppuntamento !== tomorrowISO()) {
    removeFromDomani(code, { silent: true, reset: false });
  }
  if (stato !== 'appuntamento') person.giornoAppuntamento = '';

  persistPerson(person);
  state.ui.sessionHandled.add(code);
  markTouched(code);
  saveSoon();
  computeFlags();
  render();
  scheduleOsrm();
  showToast(person.nome + ': ' + STATES[stato].label, stato === 'fuori_zona' || stato === 'cambio_fuori' ? 'warn' : 'ok');
}

function confirmGiornata() {
  const selected = state.domani.map(code => getPerson(code)).filter(person => person && !isDone(person));
  if (!selected.length) {
    showToast('Non ci sono persone da confermare.', 'warn');
    return;
  }
  const ordered = routeOrder(selected);
  for (const person of ordered) {
    if (!state.oggi.includes(person.code)) state.oggi.push(person.code);
    person.stato = 'appuntamento';
    person.giornoAppuntamento = todayISO();
    person.dataUltimoContatto = nowISO();
    persistPerson(person);
  }
  state.domani = [];
  state.ui.sessionHandled.clear();
  markTouched(ordered[0] ? ordered[0].code : null);
  state.ui.view = 'oggi';
  state.ui.resetScroll = true;
  saveNow();
  computeFlags();
  render();
  showToast(ordered.length + ' persone spostate in Oggi.', 'ok');
  haptic();
}

/* ==========================================================================
   7. GEOCoding / OSRM / FALLBACK CAP
   ========================================================================== */
function addrHash(person) {
  return hashString([normAddress(person.indirizzo), clean(person.cap), titleCaseCity(person.citta)].join('|'));
}

function geoKey(person) {
  return person.code + '|' + addrHash(person);
}

function getGeoEntry(person) {
  return state.geocache[geoKey(person)] || null;
}

function geoCoord(person) {
  const geo = getGeoEntry(person);
  if (geo && typeof geo.lat === 'number' && typeof geo.lon === 'number' && isFinite(geo.lat) && isFinite(geo.lon)) {
    return { lat: geo.lat, lon: geo.lon };
  }
  return null;
}

function nominatimQuery(person) {
  return [clean(person.indirizzo), clean(person.cap), clean(person.citta), 'Italia'].filter(Boolean).join(', ');
}

async function fetchJSON(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 15000);
  try {
    const response = await fetch(url, Object.assign({ mode: 'cors', credentials: 'omit', signal: controller.signal }, options || {}));
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

/*
 * Geocodifica in background, una richiesta per indirizzo unico (non per persona:
 * due pazienti allo stesso indirizzo condividono la risposta).
 * Cache per persona: codice paziente + hash dell'indirizzo; se l'indirizzo cambia
 * la chiave cambia e la vecchia entry viene rimossa dal form di modifica.
 * Throttling 1 req/sec per rispettare le policy di Nominatim.
 * I browser non consentono di impostare User-Agent: inviamo Accept-Language e
 * non effettuiamo più di una richiesta al secondo.
 */
async function startGeocoding() {
  if (!navigator.onLine) {
    state.geo.offline = true;
    updateGeoNote();
    return;
  }
  if (state.geo.running) {
    state.geo.rerun = true;
    return;
  }

  state.geo.running = true;
  state.geo.offline = false;
  state.geo.failed = false;
  state.geo.rerun = false;
  const generation = ++state.geo.gen;

  try {
    const groups = new Map();
    for (const person of state.personList) {
      if (state.geocache[geoKey(person)]) continue;
      const key = addrHash(person);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(person);
    }

    state.geo.total = groups.size;
    state.geo.done = 0;
    updateGeoNote();

    let first = true;
    for (const group of groups.values()) {
      if (generation !== state.geo.gen) break;
      if (!navigator.onLine) { state.geo.offline = true; break; }
      if (!first) await sleep(NOMINATIM_DELAY_MS);
      first = false;
      if (generation !== state.geo.gen) break;

      const sample = group[0];
      let entry = null;
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(nominatimQuery(sample));
        const data = await fetchJSON(url, {
          headers: { 'Accept': 'application/json', 'Accept-Language': 'it' }
        }, 15000);
        if (generation !== state.geo.gen) break;
        if (Array.isArray(data) && data.length) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          if (isFinite(lat) && isFinite(lon)) entry = { lat, lon, source: 'nominatim', ts: Date.now() };
        }
        if (!entry) entry = { notFound: true, source: 'nominatim', ts: Date.now() };
      } catch (err) {
        console.warn('Nominatim non disponibile:', err);
        state.geo.failed = true;
        break;
      }

      if (generation !== state.geo.gen) break;
      for (const person of group) state.geocache[geoKey(person)] = entry;
      state.geo.done++;
      updateGeoNote();
      saveSoon();
    }
  } finally {
    state.geo.running = false;
    computeFlags();
    updateGeoNote();
    saveSoon();
    if (!isTyping() && !state.ui.modal) render();
    const rerun = state.geo.rerun;
    state.geo.rerun = false;
    if (rerun) setTimeout(() => { startGeocoding(); }, 300);
    else scheduleOsrm();
  }
}

function osrmCacheKey(codes) {
  return hashString(codes.slice().sort().join('|'));
}

function getCachedOsrm(codes) {
  const entry = state.osrmcache[osrmCacheKey(codes)];
  if (!entry || !Array.isArray(entry.order) || !Array.isArray(entry.matrix)) return null;
  const position = new Map(entry.order.map((code, index) => [code, index]));
  if (!codes.every(code => position.has(code))) return null;
  return codes.map(from => codes.map(to => {
    const row = entry.matrix[position.get(from)];
    const value = row ? row[position.get(to)] : null;
    return typeof value === 'number' && isFinite(value) ? value : null;
  }));
}

/* Riutilizza una matrice OSRM già in cache anche quando la vista Oggi
   viene riaperta dopo un reload: evita di mostrare solo stime in linea d'aria. */
function useCachedOsrmForPeople(people) {
  const codes = people.filter(person => !!geoCoord(person)).map(person => person.code);
  if (codes.length < 2) return false;
  if (state.osrm.matrix) {
    const known = new Set(state.osrm.codes);
    if (codes.every(code => known.has(code))) return true;
  }
  for (const entry of Object.values(state.osrmcache)) {
    if (!entry || !Array.isArray(entry.order) || !Array.isArray(entry.matrix)) continue;
    const position = new Map(entry.order.map((code, index) => [code, index]));
    if (!codes.every(code => position.has(code))) continue;
    const matrix = codes.map(from => codes.map(to => {
      const row = entry.matrix[position.get(from)];
      const value = row ? row[position.get(to)] : null;
      return typeof value === 'number' && isFinite(value) ? value : null;
    }));
    state.osrm = { building: false, codes, matrix, key: osrmCacheKey(codes), failedKey: '', failed: false };
    return true;
  }
  return false;
}

function resetOsrmRuntime() {
  state.osrm = { building: false, codes: [], matrix: null, key: '', failedKey: '', failed: false };
}

function clearOsrmCache() {
  osrmEpoch++;
  state.osrmcache = {};
  resetOsrmRuntime();
}

function roadKm(a, b) {
  if (!a || !b || !state.osrm.matrix) return null;
  const i = state.osrm.codes.indexOf(a.code);
  const j = state.osrm.codes.indexOf(b.code);
  if (i < 0 || j < 0) return null;
  const row = state.osrm.matrix[i];
  const value = row ? row[j] : null;
  return typeof value === 'number' && isFinite(value) && value >= 0 ? value / 1000 : null;
}

function capProximity(a, b) {
  if (a.cap && b.cap && a.cap === b.cap) return 0;
  const capA = parseInt(a.cap, 10);
  const capB = parseInt(b.cap, 10);
  if (isValidCap(a.cap) && isValidCap(b.cap) && isFinite(capA) && isFinite(capB) && Math.abs(capA - capB) <= 30) return 3;
  if (cityKey(a.citta) && cityKey(a.citta) === cityKey(b.citta)) return 7;
  if (a.cap && b.cap) return 100;
  return 120;
}

/*
 * Distanza per l'ordinamento: OSRM (strade) quando la matrice è disponibile;
 * se manca la matrice si usa il fallback CAP/città, come richiesto. Per le
 * coppie assenti dalla matrice si usa la linea d'aria, ma solo come riempimento.
 */
function proximityKm(a, b) {
  if (!a || !b) return 120;
  if (a.code === b.code) return 0;
  const ga = geoCoord(a);
  const gb = geoCoord(b);
  if (ga && gb && state.osrm.matrix) {
    const road = roadKm(a, b);
    if (road !== null) return road;
    return haversineKm(ga, gb);
  }
  return capProximity(a, b);
}

function distanceForQueue(person, group, centroid) {
  const geo = geoCoord(person);
  if (geo && centroid) return haversineKm(geo, centroid);
  if (!group || !group.length) return 0;
  return group.reduce((sum, other) => sum + capProximity(person, other), 0) / group.length;
}

/*
 * Clustering greedy: si prende un nodo come seme e si aggregano tutti i nodi
 * entro R km (15 km); in assenza di coordinate la "distanza" è il punteggio
 * CAP/città (stesso CAP 0, CAP vicino 3, stessa città 7, altrimenti 100).
 * Si ripete sui nodi restanti.
 */
function clusterCandidates(candidates) {
  const remaining = candidates.slice().sort((a, b) => {
    const ga = geoCoord(a) ? 0 : 1;
    const gb = geoCoord(b) ? 0 : 1;
    if (ga !== gb) return ga - gb;
    const capCompare = clean(a.cap).localeCompare(clean(b.cap));
    if (capCompare) return capCompare;
    return a.nome.localeCompare(b.nome, 'it');
  });
  const clusters = [];
  while (remaining.length) {
    const seed = remaining.shift();
    const cluster = [seed];
    for (let i = 0; i < remaining.length;) {
      if (proximityKm(seed, remaining[i]) <= GEO_RADIUS_KM) {
        cluster.push(remaining.splice(i, 1)[0]);
      } else {
        i++;
      }
    }
    clusters.push(cluster);
  }
  return clusters;
}

/* Preferisce il cluster capiente (8-15) per non esaurire quelli piccoli. */
function pickCluster(clusters) {
  if (!clusters.length) return [];
  const sorted = clusters.slice().sort((a, b) => b.length - a.length);
  return sorted.find(cluster => cluster.length > TARGET && cluster.length <= 15)
    || sorted.find(cluster => cluster.length > TARGET)
    || sorted[0];
}

function queueRank(person) {
  if (state.ui.sessionHandled.has(person.code)) return 3;
  if (person.stato === 'non_risponde') return 2;
  if (person.stato === 'da_richiamare') return 1;
  return 0;
}

function computeQueue() {
  const candidates = eligiblePeople();
  if (!candidates.length) return [];

  const selected = selectedPeople();
  const clusters = clusterCandidates(candidates);
  const chosen = pickCluster(clusters);
  const chosenCodes = new Set(chosen.map(person => person.code));
  const rest = candidates.filter(person => !chosenCodes.has(person.code));
  const centroid = state.osrm.matrix ? centroidOfPeople(selected) : null;
  const referenceGroup = selected.length ? selected : chosen;
  const referenceCentroid = state.osrm.matrix
    ? (centroid || (selected.length ? null : centroidOfPeople(chosen)))
    : null;

  const compare = (a, b) => {
    const rankA = queueRank(a);
    const rankB = queueRank(b);
    if (rankA !== rankB) return rankA - rankB;
    const distA = distanceForQueue(a, referenceGroup, referenceCentroid);
    const distB = distanceForQueue(b, referenceGroup, referenceCentroid);
    if (Math.abs(distA - distB) > 0.01) return distA - distB;
    const capCompare = clean(a.cap).localeCompare(clean(b.cap));
    if (capCompare) return capCompare;
    return a.nome.localeCompare(b.nome, 'it');
  };

  return chosen.slice().sort(compare).concat(rest.slice().sort(compare));
}

/* Giro più breve possibile con euristica nearest-neighbour (n piccolo, 7). */
function routeOrder(people) {
  if (people.length < 3) return people.slice();
  let best = people.slice();
  let bestCost = Infinity;
  for (let start = 0; start < people.length; start++) {
    const used = new Array(people.length).fill(false);
    used[start] = true;
    const order = [people[start]];
    let current = people[start];
    let cost = 0;
    for (let step = 1; step < people.length; step++) {
      let bestIndex = -1;
      let bestDistance = Infinity;
      for (let i = 0; i < people.length; i++) {
        if (used[i]) continue;
        const distance = proximityKm(current, people[i]);
        if (distance < bestDistance) { bestDistance = distance; bestIndex = i; }
      }
      if (bestIndex < 0) break;
      used[bestIndex] = true;
      cost += bestDistance;
      order.push(people[bestIndex]);
      current = people[bestIndex];
    }
    if (cost < bestCost) { bestCost = cost; best = order; }
  }
  return best;
}

/* Distanza effettiva per le statistiche: OSRM se disponibile, altrimenti
   stima in linea d'aria; null se almeno un indirizzo non è geocodificato. */
function travelLeg(from, to) {
  const a = geoCoord(from);
  const b = geoCoord(to);
  if (!a || !b) return null;
  const road = roadKm(from, to);
  if (road !== null) return { km: road, mode: 'strada' };
  return { km: haversineKm(a, b), mode: 'aria' };
}

function computeRouteStats(ordered) {
  const legs = [];
  let total = 0;
  let unknown = 0;
  let road = 0;
  let air = 0;
  for (let i = 0; i < ordered.length - 1; i++) {
    const from = ordered[i];
    const to = ordered[i + 1];
    const leg = travelLeg(from, to);
    if (!leg) {
      unknown++;
      legs.push({ from, to, km: null, mode: null });
    } else {
      total += leg.km;
      legs.push({ from, to, km: leg.km, mode: leg.mode });
      if (leg.mode === 'strada') road++;
      else air++;
    }
  }
  return { legs, total, unknown, road, air, known: legs.length - unknown };
}

function formatKm(km) {
  if (km === null || km === undefined || !isFinite(km)) return 'n.d.';
  if (km < 0.05) return '0 km';
  return km.toLocaleString('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km';
}

function formatRouteTotal(stats) {
  if (!stats || !stats.legs.length) return '0 km';
  if (!stats.known) return 'n.d.';
  return formatKm(stats.total) + (stats.unknown ? ' *' : '');
}

function distanceSourceText(stats) {
  if (!stats || !stats.legs.length) return 'Nessun tratto tra tappe.';
  let text;
  if (!stats.known) {
    text = 'Distanze non disponibili: indirizzi non geocodificati';
  } else if (stats.road === 0) {
    text = 'Stime in linea d\'aria';
  } else if (stats.air === 0 && stats.unknown === 0) {
    text = 'Distanze stradali OSRM';
  } else {
    text = 'Dati misti: OSRM + stime';
  }
  if (stats.unknown) text += ' · ' + stats.unknown + ' tratti senza coordinate (totale parziale)';
  if (state.geo.running) text += ' · geocodifica in corso';
  if (state.osrm.building) text += ' · OSRM in calcolo';
  text += ' · solo tratti tra le tappe';
  return text;
}

function legsListHtml(stats) {
  if (!stats || !stats.legs.length) return '';
  const rows = stats.legs.map((leg, index) => {
    const fromIndex = index + 1;
    const toIndex = index + 2;
    const distance = leg.km === null
      ? '<strong class="unknown">n.d.</strong>'
      : '<strong>' + formatKm(leg.km) + '</strong>';
    return '<li class="leg-row"><span class="leg-route"><b>' + fromIndex + '</b> ' + esc(leg.from.nome) + ' → <b>' + toIndex + '</b> ' + esc(leg.to.nome) + '</span>' + distance + '</li>';
  }).join('');
  return '<ol class="leg-list">' + rows + '</ol>';
}

function candidateDistancePanel(candidate, selected) {
  if (!selected.length) return '';
  const currentStats = computeRouteStats(routeOrder(selected));
  const withStats = computeRouteStats(routeOrder(selected.concat(candidate)));
  let nearest = null;
  selected.forEach(person => {
    const leg = travelLeg(candidate, person);
    if (leg && (nearest === null || leg.km < nearest.km)) nearest = leg;
  });
  return '<div class="distance-panel compact candidate-distance">'
    + '<div class="distance-grid">'
    + '<div class="distance-stat"><b>' + formatRouteTotal(currentStats) + '</b><span>Percorso attuale</span></div>'
    + '<div class="distance-stat"><b>' + formatRouteTotal(withStats) + '</b><span>Con questo</span></div>'
    + '<div class="distance-stat"><b>' + (nearest ? formatKm(nearest.km) : 'n.d.') + '</b><span>Distanza dal gruppo</span></div>'
    + '</div>'
    + '<div class="distance-note">' + esc(distanceSourceText(withStats)) + '</div>'
    + '</div>';
}

function distanceDetailsHtml(ordered) {
  if (!ordered || ordered.length < 2) return '';
  const stats = computeRouteStats(ordered);
  return '<details class="panel distance-details">'
    + '<summary><span>Distanze tra le tappe</span><strong>' + formatRouteTotal(stats) + '</strong></summary>'
    + '<div class="distance-body">' + legsListHtml(stats) + '</div></details>'
    + '<p class="distance-note">' + esc(distanceSourceText(stats)) + '</p>';
}

async function fetchOsrmMatrix(nodes) {
  const total = nodes.length;
  const matrix = Array.from({ length: total }, () => Array(total).fill(null));
  const chunks = [];
  for (let i = 0; i < total; i += OSRM_CHUNK_SIZE) {
    const chunk = [];
    for (let j = i; j < Math.min(total, i + OSRM_CHUNK_SIZE); j++) chunk.push(j);
    chunks.push(chunk);
  }

  let requests = 0;
  for (let a = 0; a < chunks.length; a++) {
    for (let b = a; b < chunks.length; b++) {
      const first = chunks[a];
      const second = chunks[b];
      const indexes = a === b ? first : first.concat(second);
      if (indexes.length > 25) throw new Error('Blocco OSRM troppo grande');
      if (requests > 0) await sleep(OSRM_DELAY_MS);
      requests++;

      const coords = indexes.map(index => `${nodes[index].lon.toFixed(6)},${nodes[index].lat.toFixed(6)}`).join(';');
      const url = 'https://router.project-osrm.org/table/v1/driving/' + coords + '?annotations=distance';
      const data = await fetchJSON(url, { headers: { 'Accept': 'application/json' } }, 20000);
      if (!data || !Array.isArray(data.distances)) throw new Error('Risposta OSRM non valida');
      const distances = data.distances;

      for (let i = 0; i < first.length; i++) {
        for (let j = 0; j < second.length; j++) {
          if (a === b) {
            const value = distances[i] ? distances[i][j] : null;
            matrix[first[i]][first[j]] = typeof value === 'number' && isFinite(value) ? value : null;
          } else {
            const forward = distances[i] ? distances[i][first.length + j] : null;
            const backward = distances[first.length + j] ? distances[first.length + j][i] : null;
            matrix[first[i]][second[j]] = typeof forward === 'number' && isFinite(forward) ? forward : null;
            matrix[second[j]][first[i]] = typeof backward === 'number' && isFinite(backward) ? backward : null;
          }
        }
      }
    }
  }
  return matrix;
}

async function ensureOsrm() {
  if (state.ui.view !== 'domani' || state.geo.running) return;
  if (!navigator.onLine) { state.osrm.failed = true; updateGeoNote(); return; }
  if (state.osrm.building) return;

  let pool = [];
  const seen = new Set();
  for (const person of selectedPeople().concat(eligiblePeople())) {
    if (!seen.has(person.code) && geoCoord(person)) {
      seen.add(person.code);
      pool.push(person);
    }
  }
  if (pool.length > OSRM_MAX_NODES) {
    const selected = selectedPeople().filter(person => geoCoord(person));
    const selectedCodes = new Set(selected.map(person => person.code));
    const rest = pool.filter(person => !selectedCodes.has(person.code));
    pool = selected.concat(rest.slice(0, Math.max(0, OSRM_MAX_NODES - selected.length)));
  }

  const codes = pool.map(person => person.code);
  if (codes.length < 2) {
    resetOsrmRuntime();
    updateGeoNote();
    return;
  }

  const key = osrmCacheKey(codes);
  if (state.osrm.matrix && state.osrm.key === key) return;
  if (state.osrm.failedKey === key) return;

  const cached = getCachedOsrm(codes);
  if (cached) {
    state.osrm = { building: false, codes, matrix: cached, key, failedKey: '', failed: false };
    updateGeoNote();
    if (!isTyping() && !state.ui.modal) render();
    return;
  }

  state.osrm.building = true;
  state.osrm.failed = false;
  updateGeoNote();
  const epoch = osrmEpoch;
  const nodes = pool.map(person => {
    const coord = geoCoord(person);
    return { code: person.code, lat: coord.lat, lon: coord.lon };
  });

  try {
    const matrix = await fetchOsrmMatrix(nodes);
    if (epoch !== osrmEpoch) return;
    state.osrmcache[key] = { order: codes, matrix, ts: Date.now() };
    trimOsrmCache();
    state.osrm = { building: false, codes, matrix, key, failedKey: '', failed: false };
    saveSoon();
    updateGeoNote();
    if (!isTyping() && !state.ui.modal) render();
  } catch (err) {
    if (epoch !== osrmEpoch) return;
    console.warn('OSRM non disponibile:', err);
    state.osrm = { building: false, codes: [], matrix: null, key: '', failedKey: key, failed: true };
    updateGeoNote();
  }
}

function scheduleOsrm() {
  if (state.ui.view !== 'domani' || state.geo.running) return;
  if (osrmTimer) clearTimeout(osrmTimer);
  osrmTimer = setTimeout(() => {
    osrmTimer = null;
    ensureOsrm();
  }, 900);
}

function geoNoteHtml() {
  if (state.geo.running) {
    return '<span class="spinner" aria-hidden="true"></span><span>Geocodifica indirizzi ' + state.geo.done + '/' + (state.geo.total || '…') + '…</span>';
  }
  if (state.osrm.building) return '<span class="spinner" aria-hidden="true"></span><span>Calcolo distanze stradali…</span>';
  if (state.osrm.matrix) return ICON.route + '<span>Distanze stradali attive.</span>';
  if (!navigator.onLine) return ICON.wifiOff + '<span>Offline: ordinamento per CAP – rete non disponibile.</span>';
  return ICON.warn + '<span>Ordinamento per CAP – rete non disponibile.</span>';
}

function updateGeoNote() {
  const html = geoNoteHtml();
  document.querySelectorAll('[data-geo-note]').forEach(el => { el.innerHTML = html; });
}

function startGeocodingIfPossible() {
  setTimeout(() => { startGeocoding(); }, 400);
}

function updateHeader() {
  const dateEl = document.getElementById('header-date');
  if (dateEl) dateEl.textContent = capitalize(formatLongDate(todayISO())) + ' · demo';
  const plannedToday = state.oggi.length;
  const oggiEl = document.getElementById('stat-oggi');
  const domaniEl = document.getElementById('stat-domani');
  if (oggiEl) {
    oggiEl.textContent = 'Oggi: ' + plannedToday + '/' + TARGET;
    oggiEl.title = 'Persone pianificate per oggi';
  }
  if (domaniEl) {
    domaniEl.textContent = 'Domani: ' + state.domani.length + '/' + TARGET;
    domaniEl.title = 'Selezionati per domani';
  }
}

function updateNav() {
  document.querySelectorAll('.nav-btn[data-nav]').forEach(button => {
    if (button.dataset.nav === state.ui.view) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
}

function render() {
  const previousScroll = window.scrollY || window.pageYOffset || 0;
  const targetScroll = state.ui.resetScroll ? 0 : previousScroll;
  state.ui.resetScroll = false;
  updateHeader();
  updateNav();
  const app = document.getElementById('app');
  if (!app) return;
  if (state.ui.view === 'domani') app.innerHTML = viewDomani();
  else if (state.ui.view === 'totale') app.innerHTML = viewTotale();
  else if (state.ui.view === 'impostazioni') app.innerHTML = viewImpostazioni();
  else app.innerHTML = viewOggi();
  updatePersistBanner();
  updateGeoNote();
  requestAnimationFrame(() => {
    if (Math.abs((window.scrollY || 0) - targetScroll) > 2) window.scrollTo(0, targetScroll);
  });
  if (state.ui.view === 'domani') scheduleOsrm();
}

function badgesHtml(person) {
  const badges = [];
  if (person.telMancante) {
    badges.push('<span class="badge badge-danger">Tel. mancante</span>');
  } else if (person.telSospetto) {
    badges.push('<span class="badge badge-warn" title="' + esc(person.telefono) + '">Telefono sospetto</span>');
  }
  if (person.capSospetto) badges.push('<span class="badge badge-warn">CAP sospetto</span>');
  if (person.indirizzoIncerto) {
    badges.push('<span class="badge badge-warn" title="' + esc(person.indirizzoProblemi.join(' · ')) + '">Indirizzo incerto</span>');
  }
  if (person.stato === 'non_risponde') badges.push('<span class="badge badge-recall">Da ricontattare</span>');
  if (person.fuoriZona) badges.push('<span class="badge badge-danger">Fuori zona</span>');
  if (person.modificato) {
    badges.push('<button type="button" class="badge badge-edit" data-action="toggle-original" data-code="' + esc(person.code) + '">modificato</button>');
  }
  const addressSiblings = person.indirizzo && state.meta.addressCounts ? (state.meta.addressCounts.get(personAddressKey(person)) || 1) : 1;
  if (addressSiblings > 1) badges.push('<span class="badge badge-blue">Stesso indirizzo · ' + addressSiblings + '</span>');
  if (state.domani.includes(person.code)) badges.push('<span class="badge badge-blue">Per domani</span>');
  if (state.oggi.includes(person.code)) badges.push('<span class="badge badge-green">Oggi</span>');
  return badges.length ? '<div class="badges">' + badges.join('') + '</div>' : '';
}

const QUICK_OUTCOMES = {
  domani: ['appuntamento', 'non_risponde', 'fuori_zona', 'gia_riconsegnato'],
  oggi: ['ritirato', 'gia_riconsegnato', 'non_risponde', 'fuori_zona'],

function outcomeButton(person, stato, extraClass) {
  const label = stato === 'da_contattare' ? 'Azzera esito' : STATES[stato].label;

function outcomesHtml(person, context) {
  const quick = (QUICK_OUTCOMES[context] || QUICK_OUTCOMES.oggi).slice();
  let html = '<div class="outcome-grid">';
  quick.forEach(stato => { html += outcomeButton(person, stato, ''); });
  if (context === 'domani') {
    html += '<button type="button" class="outcome-btn esito-salta wide" data-action="salta" data-code="' + esc(person.code) + '">Salta</button>';
  }
  html += '</div>';

  const others = STATE_ORDER.filter(stato => !quick.includes(stato) && stato !== person.stato);
  if (!others.includes('da_contattare') && person.stato !== 'da_contattare') others.push('da_contattare');
  if (others.length) {
    html += '<details class="more-outcomes"><summary>Altri esiti</summary><div class="outcome-grid">';
    others.forEach(stato => { html += outcomeButton(person, stato, ''); });
    html += '</div></details>';

  return html;
}

    + noteHtml(person)

function groupedPeopleHtml(people, renderer) {
  const groups = [];
  people.forEach((person, index) => {
    const key = personAddressKey(person);
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.items.push({ person, index });
    else groups.push({ key, items: [{ person, index }] });
  });

  return groups.map(group => {
    if (group.items.length === 1) return renderer(group.items[0].person, group.items[0].index);
    const first = group.items[0].person;
    return '<div class="addr-group"><div class="addr-group-head">' + ICON.pin
      + '<span class="addr-text">' + esc(shortAddress(first)) + '</span>'
      + '<span class="count">' + group.items.length + ' persone</span></div>'
      + group.items.map(item => renderer(item.person, item.index)).join('') + '</div>';
  }).join('');
}

function viewOggi() {

    + '<div class="summary-next">' + (next
      ? 'Prossima tappa: <strong>' + esc(next.nome) + '</strong><span class="nx-addr">' + esc(shortAddress(next)) + '</span>'

  } else {
    html += groupedPeopleHtml(people, (person, index) => personCard(person, { context: 'oggi', index }));
  }

  html += '</section>';
  return html;
}

function candidateDistanceLabel(person, selected) {
  if (!selected.length) return '';
  const coord = geoCoord(person);
  const centroid = state.osrm.matrix ? centroidOfPeople(selected) : null;
  if (coord && centroid) return '≈ ' + Math.round(haversineKm(coord, centroid)) + ' km dal gruppo';
  const sameCap = selected.some(other => person.cap && other.cap === person.cap);
  const sameCity = selected.some(other => cityKey(other.citta) && cityKey(other.citta) === cityKey(person.citta));
  if (sameCap) return 'Stesso CAP del gruppo';
  if (sameCity) return 'Stessa città del gruppo';
  return '';
}

      + '<button type="button" class="btn btn-confirm" data-action="confirm-day">Conferma giornata → Oggi</button>'
      + '<p class="panel-sub" style="text-align:center;margin-top:8px">Le 7 persone verranno spostate in Oggi.</p></div>';

        + selected.map((person, index) =>

          + '<small>' + esc(shortAddress(person)) + '</small></span>'

/* ==========================================================================
   13. VISTA TOTALE
   ========================================================================== */
function stateCounts() {
  const counts = {
    da_contattare: 0, appuntamento: 0, non_risponde: 0, da_richiamare: 0,
    cambio_zona: 0, cambio_fuori: 0, fuori_zona: 0, gia_riconsegnato: 0, ritirato: 0
  };
  for (const person of state.personList) {
    if (counts[person.stato] !== undefined) counts[person.stato]++;
  }
  return counts;
}

function filterPeople() {
  const filter = state.ui.filter;
  const search = normalizeSearch(filter.search);
  let people = state.personList.slice();

  if (filter.stato === 'da_contattare') {
    people = people.filter(person => person.stato === 'da_contattare' || person.stato === 'cambio_zona');
  } else if (filter.stato === 'fuori_zona') {
    people = people.filter(person => person.stato === 'fuori_zona' || person.stato === 'cambio_fuori');
  } else if (filter.stato) {
    people = people.filter(person => person.stato === filter.stato);
  }

  if (filter.cap) people = people.filter(person => person.cap === filter.cap);
  if (filter.citta) people = people.filter(person => cityKey(person.citta) === filter.citta);
  if (filter.ricontattare) people = people.filter(person => person.stato === 'non_risponde' || person.stato === 'da_richiamare');
  if (filter.telSospetto) people = people.filter(person => person.telSospetto);
  if (filter.capSospetto) people = people.filter(person => person.capSospetto);
  if (filter.indirizzoIncerto) people = people.filter(person => person.indirizzoIncerto);

  if (search) {
    people = people.filter(person => {
      const haystack = normalizeSearch([
        person.nome, person.code, person.indirizzo, person.citta, person.telefono,
        formatPhone(person.telefono), person.telefonoRaw, person.secondari.join(' '),
        person.secondari.map(formatPhone).join(' '), person.noteIntervento
      ].join(' '));
      return haystack.includes(search);
    });
  }

  if (state.settings.raggruppa) {
    people.sort((a, b) => {
      const addressCompare = personAddressKey(a).localeCompare(personAddressKey(b));
      if (addressCompare) return addressCompare;
      return a.nome.localeCompare(b.nome, 'it');
    });
  } else {
    people.sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
  }
  return people;
}

function openAddressModal(code, options) {
  const person = getPerson(code);

}

function closeModal() {
  state.ui.modal = null;
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
  document.body.classList.remove('modal-open');
  if (lastModalFocus && lastModalFocus.isConnected && typeof lastModalFocus.focus === 'function') {
    try { lastModalFocus.focus(); } catch (err) { /* niente */ }
  }
  lastModalFocus = null;
}

function renderModal() {

    : 'Nessuna modifica precedente.';

    ? '<div class="transfer-note"><strong>' + (modal.transfer === 'cambio_fuori' ? 'Cambio residenza – fuori zona' : 'Cambio residenza – in zona') + '</strong><br>'
      + (modal.transfer === 'cambio_fuori'
        ? 'Salvando, la persona sarà marcata come fatta e non sarà più proposta.'
        : 'Salvando, la persona resterà eleggibile per la pianificazione.') + '</div>'

    + '<div class="modal-head"><div><h2 id="modal-title">Modifica indirizzo</h2><div class="modal-sub">' + esc(person.nome) + (modal.transfer ? ' · cambio residenza' : '') + '</div></div>'

    + '<datalist id="motivi-modifica"><option value="trasferimento"><option value="corretto da chiamata"><option value="incerto da geocoding"><option value="nuovo indirizzo"></datalist></label>'

function modalError(message) {
  const box = document.getElementById('addr-error');
  if (!box) return;
  box.textContent = message;
  box.classList.remove('hidden');
}

function saveAddress() {
  const modal = state.ui.modal;
  if (!modal || modal.type !== 'address') return;
  const person = getPerson(modal.code);
  if (!person) { closeModal(); return; }

  const indInput = document.getElementById('addr-ind');
  const cityInput = document.getElementById('addr-citta');
  const capInput = document.getElementById('addr-cap');
  const reasonInput = document.getElementById('addr-motivo');
  if (!indInput || !cityInput || !capInput) return;

  const indirizzo = normAddress(indInput.value);
  const cittaInputRaw = cityInput.value;
  const citta = titleCaseCity(cittaInputRaw);
  const cap = clean(capInput.value);
  const motivo = reasonInput ? clean(reasonInput.value) : '';

  if (!indirizzo) { modalError('Inserisci l\'indirizzo.'); indInput.focus(); return; }
  if (!citta) { modalError('Inserisci la città.'); cityInput.focus(); return; }

  const old = { indirizzo: person.indirizzo, citta: person.citta, cap: person.cap };
  const changed = old.indirizzo !== indirizzo || old.citta !== citta || old.cap !== cap;
  if (!changed && !motivo && !modal.transfer) {
    closeModal();
    showToast('Nessuna modifica all\'indirizzo.');
    return;
  }

  const oldKey = geoKey(person);
  const now = nowISO();
  person.indirizzoPrecedente = old.indirizzo;
  person.indirizzo = indirizzo;
  person.indirizzoRaw = indInput.value.trim();
  person.citta = citta;
  person.cittaRaw = clean(cittaInputRaw);
  person.cap = cap;
  person.modificato = !(indirizzo === person.indirizzoOriginale && citta === person.cittaOriginale && cap === person.capOriginale);
  person.dataModificaIndirizzo = person.modificato ? now : '';
  person.motivoModifica = person.modificato ? (motivo || modal.motivo || '') : '';
  person.log = Array.isArray(person.log) ? person.log : [];
  person.log.push({
    data: now,
    tipo: 'modifica',
    precedente: old,
    nuovo: { indirizzo, citta, cap },
    motivo: motivo || modal.motivo || ''
  });

  if (changed) {
    delete state.geocache[oldKey];
    delete state.geocache[geoKey(person)];
    clearOsrmCache();
    state.geo.gen++;
    state.geo.rerun = true;
  }

  /* Cambio residenza: l'esito viene applicato solo al salvataggio del form. */
  if (modal.transfer) {
    person.stato = modal.transfer;
    person.giornoAppuntamento = '';
    person.dataUltimoContatto = now;
    if (modal.transfer === 'cambio_fuori') {
      person.fuoriZona = true;
      if (state.domani.includes(person.code)) removeFromDomani(person.code, { silent: true, reset: false });
    } else {
      person.fuoriZona = false;
    }
    state.ui.sessionHandled.add(person.code);
    markTouched(person.code);
    person.log.push({
      data: now,
      tipo: 'esito',
      stato: modal.transfer,
      motivo: 'trasferimento'
    });
  }

  persistPerson(person);
  saveSoon();
  closeModal();
  computeFlags();
  render();
  if (modal.transfer === 'cambio_fuori') {
    showToast('Cambio residenza fuori zona registrato.', 'warn');
  } else if (modal.transfer === 'cambio_zona') {
    showToast('Cambio residenza in zona registrato.', 'ok');
    scheduleOsrm();
  } else {
    showToast('Indirizzo aggiornato.', 'ok');
  }
  if (changed) startGeocodingIfPossible();
}

/* Ripristino in un tap: torna ai valori del CSV importato. */
function restoreAddress(code) {
  const person = getPerson(code || (state.ui.modal ? state.ui.modal.code : ''));
  if (!person) return;
  const oldKey = geoKey(person);
  const old = { indirizzo: person.indirizzo, citta: person.citta, cap: person.cap };
  const now = nowISO();

  person.indirizzo = person.indirizzoOriginale;
  person.indirizzoRaw = person.indirizzoOriginale;
  person.citta = person.cittaOriginale;
  person.cittaRaw = person.cittaOriginale;
  person.cap = person.capOriginale;
  person.modificato = false;
  person.indirizzoPrecedente = old.indirizzo;
  person.dataModificaIndirizzo = '';
  person.motivoModifica = '';
  person.log = Array.isArray(person.log) ? person.log : [];
  person.log.push({
    data: now,
    tipo: 'ripristino',
    precedente: old,
    nuovo: { indirizzo: person.indirizzoOriginale, citta: person.cittaOriginale, cap: person.capOriginale },
    motivo: 'ripristino originale'
  });

  delete state.geocache[oldKey];
  delete state.geocache[geoKey(person)];
  clearOsrmCache();
  state.geo.gen++;
  state.geo.rerun = true;
  persistPerson(person);
  saveSoon();
  closeModal();
  computeFlags();
  render();
  showToast('Indirizzo originale ripristinato.', 'ok');
  startGeocodingIfPossible();
}

/* ==========================================================================
   16. CSV: IMPORTAZIONE / ESPORTAZIONE / SNAPSHOT
   ========================================================================== */
function applyCsv(raw) {
  const parsed = parseCSV(raw);
  const header = validateCSV(parsed);
  const rows = rowsFromParsed(parsed, header);
  if (!rows.length) throw new Error('Il CSV non contiene righe di dati.');

  state.rawCsv = raw;
  state.headers = header;
  state.rows = rows;
  buildPeople();

  const validCodes = new Set(state.people.keys());
  for (const code of Object.keys(state.esiti)) {
    if (!validCodes.has(code)) delete state.esiti[code];
  }
  applyEsiti();
  return { rows: rows.length, people: state.people.size };
}

async function handleImportFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const text = await readFileText(file);
    if (!confirm('Importare "' + file.name + '"?\n\nI dati attuali verranno sostituiti. Gli esiti dei codici paziente presenti nel nuovo CSV restano.')) {
      input.value = '';
      return;
    }
    const counts = applyCsv(text);
    clearOsrmCache();
    state.geocache = {};
    state.geo.gen++;
    state.geo.failed = false;
    state.geo.offline = false;
    state.geo.rerun = false;
    state.ui.sessionHandled.clear();
    state.ui.expanded.clear();
    state.ui.showOriginal.clear();
    state.ui.filter = { stato: '', cap: '', citta: '', search: '', ricontattare: false, telSospetto: false, capSospetto: false, indirizzoIncerto: false };
    syncPlans();
    computeFlags();
    render();
    saveNow();
    showToast('CSV importato: ' + counts.people + ' persone, ' + counts.rows + ' dispositivi.', 'ok');
    startGeocodingIfPossible();
  } catch (err) {
    console.error(err);
    showToast('Import non riuscito: ' + err.message, 'err');
  } finally {
    input.value = '';
  }
}

function csvEscape(value) {
  return '"' + String(value === null || value === undefined ? '' : value).replace(/"/g, '""') + '"';
}

function buildExportCsv() {
  const extraSet = new Set(EXPORT_EXTRA_COLUMNS);
  const baseHeaders = state.headers.filter(header => header && !extraSet.has(header));
  const headers = baseHeaders.concat(EXPORT_EXTRA_COLUMNS);
  const lines = [headers.map(csvEscape).join(',')];

  for (const row of state.rows) {
    const person = getPerson(patientCode(row));
    const out = {};
    for (const header of baseHeaders) out[header] = row[header] !== undefined ? row[header] : '';

    if (person) {
      if (person.modificato) {
        out['Indirizzo'] = person.indirizzo;
        out['Città'] = person.citta;
        out['CAP'] = person.cap;
      }
      const saved = state.esiti[person.code];
      if (saved && saved.dataUltimoContatto) {
        out['Esito Intervento'] = statusLabel(person);
      }
      const geo = geoCoord(person);
      out['StatoCalcolato'] = statusLabel(person);
      out['GiornoAppuntamento'] = person.stato === 'appuntamento' ? (person.giornoAppuntamento || '') : '';
      out['DataUltimoContatto'] = person.dataUltimoContatto || '';
      out['Lat'] = geo ? geo.lat.toFixed(6) : '';
      out['Lon'] = geo ? geo.lon.toFixed(6) : '';
      out['NoteOperatore'] = person.noteOperatore || '';
      out['TelefonoNormalizzato'] = person.telefono || '';
      out['TelefonoSecondario'] = person.secondari.join(' / ');
      out['FuoriZonaSiNo'] = person.fuoriZona ? 'SI' : 'NO';
      out['IndirizzoOriginale'] = person.indirizzoOriginale || '';
      out['CittaOriginale'] = person.cittaOriginale || '';
      out['CAPOriginale'] = person.capOriginale || '';
      out['DataModificaIndirizzo'] = person.dataModificaIndirizzo || '';
      out['MotivoModificaIndirizzo'] = person.motivoModifica || '';
    } else {
      EXPORT_EXTRA_COLUMNS.forEach(header => { out[header] = ''; });
    }
    lines.push(headers.map(header => csvEscape(out[header])).join(','));
  }

  return '\uFEFF' + lines.join('\r\n') + '\r\n';
}

function exportCsv() {
  const csv = buildExportCsv();
  downloadBlob(csv, 'ritiri_export_' + todayISO() + '.csv', 'text/csv;charset=utf-8');
  showToast('CSV esportato con ' + state.rows.length + ' righe.', 'ok');
}

function saveSnapshot() {
  const modifiche = {};
  Object.keys(state.esiti).forEach(code => {
    const saved = state.esiti[code];
    if (saved && Array.isArray(saved.log) && saved.log.length) modifiche[code] = saved.log;
  });
  const snapshot = {
    app: 'ritiri-pianificazione',
    version: 1,
    savedAt: nowISO(),
    data: state.rawCsv,
    esiti: state.esiti,
    geocoding_cache: state.geocache,
    osrm_cache: state.osrmcache,
    giornata_oggi: state.oggi,
    giornata_domani: state.domani,
    impostazioni: state.settings,
    modifiche
  };
  downloadBlob(JSON.stringify(snapshot), 'ritiri_stato_' + todayISO() + '.json', 'application/json;charset=utf-8');
  showToast('Stato salvato in un file .json.', 'ok');
}

async function handleLoadState(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const text = stripBOM(await readFileText(file));
    const snapshot = JSON.parse(text);
    const csv = typeof snapshot.data === 'string' ? snapshot.data : (typeof snapshot.dati_csv === 'string' ? snapshot.dati_csv : '');
    if (!csv) throw new Error('Lo snapshot non contiene i dati CSV.');

    const parsed = parseCSV(csv);
    validateCSV(parsed);
    if (!confirm('Caricare lo stato salvato il ' + (formatDateTime(snapshot.savedAt) || '—') + '?\n\nI dati attuali verranno sostituiti.')) {
      input.value = '';
      return;
    }

    state.esiti = snapshot.esiti && typeof snapshot.esiti === 'object' && !Array.isArray(snapshot.esiti) ? snapshot.esiti : {};
    state.geocache = snapshot.geocoding_cache && typeof snapshot.geocoding_cache === 'object' && !Array.isArray(snapshot.geocoding_cache) ? snapshot.geocoding_cache : {};
    state.osrmcache = snapshot.osrm_cache && typeof snapshot.osrm_cache === 'object' && !Array.isArray(snapshot.osrm_cache) ? snapshot.osrm_cache : {};
    state.oggi = asStringArray(snapshot.giornata_oggi);
    state.domani = asStringArray(snapshot.giornata_domani);
    state.settings = Object.assign({ raggruppa: true }, snapshot.impostazioni && typeof snapshot.impostazioni === 'object' ? snapshot.impostazioni : {});
    if (snapshot.modifiche && typeof snapshot.modifiche === 'object') {
      Object.keys(snapshot.modifiche).forEach(code => {
        if (state.esiti[code] && (!Array.isArray(state.esiti[code].log) || !state.esiti[code].log.length)) {
          state.esiti[code].log = snapshot.modifiche[code];
        }
      });
    }

    applyCsv(csv);
    osrmEpoch++;
    resetOsrmRuntime();
    state.geo.gen++;
    state.geo.rerun = false;
    state.geo.failed = false;
    state.ui.sessionHandled.clear();
    state.ui.expanded.clear();
    state.ui.showOriginal.clear();
    state.ui.filter = { stato: '', cap: '', citta: '', search: '', ricontattare: false, telSospetto: false, capSospetto: false, indirizzoIncerto: false };
    syncPlans();
    computeFlags();
    render();
    saveNow();
    showToast('Stato caricato: ' + state.personList.length + ' persone.', 'ok');
    startGeocodingIfPossible();
  } catch (err) {
    console.error(err);
    showToast('Caricamento non riuscito: ' + err.message, 'err');
  } finally {
    input.value = '';
  }
}

function recalcGeocoding() {
  if (!confirm('Svuotare la cache di geocoding e ricalcolare gli indirizzi?')) return;
  state.geocache = {};
  clearOsrmCache();
  state.geo.gen++;
  state.geo.rerun = true;
  state.geo.failed = false;
  computeFlags();
  render();
  saveNow();
  showToast('Geocoding azzerato: ricalcolo in corso…', 'ok');
  startGeocoding();
}

function resetData() {
  if (Date.now() > resetArmedUntil) {
    resetArmedUntil = Date.now() + 7000;
    render();
    showToast('Tocca di nuovo "Reset dati" entro 7 secondi per confermare.', 'warn');
    return;
  }
  resetArmedUntil = 0;
  if (state.storageOK) {
    Object.keys(STORAGE_KEYS).forEach(key => {
      try { localStorage.removeItem(STORAGE_KEYS[key]); } catch (err) { /* niente */ }
    });
  }
  state.esiti = {};
  state.geocache = {};
  state.osrmcache = {};
  state.oggi = [];
  state.domani = [];
  state.settings = { raggruppa: true };
  state.ui.sessionHandled.clear();
  state.ui.expanded.clear();
  state.ui.showOriginal.clear();
  state.ui.filter = { stato: '', cap: '', citta: '', search: '', ricontattare: false, telSospetto: false, capSospetto: false, indirizzoIncerto: false };
  state.geo.gen++;
  state.geo.rerun = false;
  state.geo.failed = false;
  clearOsrmCache();
  applyCsv(seedCsv());
  syncPlans();
  computeFlags();
  render();
  saveNow();
  showToast('Dati di esempio ripristinati.', 'ok');
  startGeocodingIfPossible();
}

function seedCsv() {
  const node = document.getElementById('seed-csv');
  return node ? String(node.textContent || '').trim() : '';
}

/* ==========================================================================
   17. EVENTI
   ========================================================================== */
function setView(view) {
  if (['oggi', 'domani', 'totale', 'impostazioni'].indexOf(view) < 0) return;
  if (state.ui.view === view) {
    state.ui.resetScroll = true;
    render();
    return;
  }
  state.ui.view = view;
  state.ui.resetScroll = true;
  state.ui.lastTouched = null;
  render();
}

function toggleExpanded(code) {
  if (state.ui.expanded.has(code)) state.ui.expanded.delete(code);
  else state.ui.expanded.add(code);
  renderTotaleResultsOnly();
}

function toggleOriginal(code) {
  if (state.ui.showOriginal.has(code)) state.ui.showOriginal.delete(code);
  else state.ui.showOriginal.add(code);
  render();
}

function clearFilters() {
  state.ui.filter = { stato: '', cap: '', citta: '', search: '', ricontattare: false, telSospetto: false, capSospetto: false, indirizzoIncerto: false };
}

document.addEventListener('click', event => {
  const navButton = event.target.closest('[data-nav]');
  if (navButton) {
    event.preventDefault();
    setView(navButton.dataset.nav);
    return;
  }

  const el = event.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const code = el.dataset.code;

  switch (action) {
    case 'close-modal':
      if (event.target === el || el.classList.contains('modal-close')) closeModal();
      break;
    case 'cancel-address':
      closeModal();
      break;
    case 'edit-address':
      event.preventDefault();
      openAddressModal(code);
      break;
    case 'save-address':
      saveAddress();
      break;
    case 'restore-address':
      restoreAddress(code);
      break;
    case 'esito': {
      haptic();
      const stato = el.dataset.esito;
      if (stato === 'cambio_zona' || stato === 'cambio_fuori') {
        /* Il form si apre subito; l'esito viene registrato al salvataggio. */
        openAddressModal(code, { motivo: 'trasferimento', transfer: stato });
      } else {
        applyEsito(code, stato, { tomorrow: state.ui.view === 'domani' });
      }
      break;
    }
    case 'salta':
      haptic();
      state.ui.sessionHandled.add(code);
      markTouched(code);
      render();
      showToast('Candidato saltato.', 'ok');
      break;
    case 'remove-domani':
      removeFromDomani(code);
      break;
    case 'confirm-day':
      confirmGiornata();
      break;
    case 'toggle-row':
      toggleExpanded(code);
      break;
    case 'toggle-original':
      toggleOriginal(code);
      break;
    case 'why-address': {
      const person = getPerson(code);
      showToast(person && person.indirizzoProblemi.length ? person.indirizzoProblemi.join(' · ') : 'Nessun problema rilevato.', 'warn');
      break;
    }
    case 'set-filter':
      state.ui.filter.stato = el.dataset.stato || '';
      render();
      break;
    case 'clear-filters':
      clearFilters();
      render();
      break;
    case 'trigger-import': {
      const input = document.getElementById('import-csv-input');
      if (input) input.click();
      break;
    }
    case 'trigger-load': {
      const input = document.getElementById('load-state-input');
      if (input) input.click();
      break;
    }
    case 'export-csv':
      exportCsv();
      break;
    case 'save-state':
      saveSnapshot();
      break;
    case 'recalc-geo':
      recalcGeocoding();
      break;
    case 'reset-data':
      resetData();
      break;
    default:
      break;
  }
});

document.addEventListener('input', event => {
  const target = event.target;
  if (target.matches('[data-note]')) {
    const person = getPerson(target.dataset.note);
    if (person) {
      person.noteOperatore = target.value;
      persistPerson(person);
      saveSoon();
      const status = target.closest('.note-block') ? target.closest('.note-block').querySelector('.note-status') : null;
      if (status) status.textContent = 'salvato';
    }
    return;
  }
  if (target.matches('[data-search]')) {
    state.ui.filter.search = target.value;
    renderTotaleResultsOnly();
  }
});

document.addEventListener('change', event => {
  const target = event.target;
  if (target.id === 'import-csv-input') { handleImportFile(target); return; }
  if (target.id === 'load-state-input') { handleLoadState(target); return; }
  if (target.matches('[data-appt-date]')) {
    setAppointmentDate(target.dataset.apptDate, target.value);
    return;
  }
  if (target.matches('[data-filter]')) {
    const key = target.dataset.filter;
    if (key === 'raggruppa') {
      state.settings.raggruppa = !!target.checked;
      saveSoon();
    } else if (target.type === 'checkbox') {
      state.ui.filter[key] = !!target.checked;
    } else {
      state.ui.filter[key] = target.value;
    }
    render();
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && state.ui.modal) closeModal();
});

window.addEventListener('online', () => {
  state.geo.offline = false;
  state.geo.failed = false;
  updateGeoNote();
  showToast('Connessione ripristinata.', 'ok');
  startGeocodingIfPossible();
  scheduleOsrm();
});

window.addEventListener('offline', () => {
  state.geo.offline = true;
  updateGeoNote();
  showToast('Sei offline: uso CAP e città.', 'warn');
});

window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveNow();
});

/* ==========================================================================
   18. AVVIO
   ========================================================================== */
function boot() {
  state.storageOK = storageTest();
  if (state.storageOK) loadLocalState();

  let usedSeed = false;
  if (!state.rawCsv) {
    state.rawCsv = seedCsv();
    usedSeed = true;
  }

  try {
    applyCsv(state.rawCsv);
  } catch (err) {
    console.error('CSV non valido:', err);
    state.esiti = {};
    state.oggi = [];
    state.domani = [];
    state.geocache = {};
    state.osrmcache = {};
    applyCsv(seedCsv());
    usedSeed = true;
    showToast('Dati salvati non validi: caricato il CSV di esempio.', 'warn');
  }

  syncPlans();
  computeFlags();
  updatePersistBanner();
  render();
  saveSoon();
  if (usedSeed) console.info('Ritiri: caricato il CSV di esempio incluso nel file.');
  startGeocodingIfPossible();
}

boot();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () { /* file:// o browser senza supporto */ });
  });
}
</script>
</body>
