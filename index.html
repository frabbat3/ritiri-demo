<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<!--
  ============================================================================
  RITIRI DEMO · Pianificazione giornaliera — demo pubblica, dati fittizi, PWA offline
  ============================================================================
  VERSIONE DEMO PUBBLICA: il seed contiene solo dati inventati. Il CSV reale
  importato dal telefono resta nel browser del dispositivo e non viene
  caricato sul repository. Dopo il primo caricamento il service worker
  permette l'uso offline.
  ============================================================================
  COME SI USA
  1) Copia questo file sul telefono e aprilo con Safari (iOS) o Chrome (Android)
     direttamente da file:// — non serve alcun server né connessione.
  2) All'avvio viene caricato il CSV di esempio (seed). Per usare i dati reali:
     Impostazioni → Importa CSV → scegli il file esportato dal gestionale.
  3) Vai in "Domani": l'app propone un candidato alla volta, puoi chiamarlo,
     registrare l'esito e selezionare fino a 7 persone per la giornata.
     Con 7 selezionati compare "Conferma giornata": le persone passano in "Oggi".
  4) In "Oggi" registri gli esiti dei ritiri. In "Totale" filtri, cerchi e
     controlli tutti i contatti e i contatori.
  5) Su iOS il localStorage da file:// può essere bloccato: in quel caso compare
     un banner. Usa sempre "Salva stato (.json)" per un backup e "Carica stato"
     per ripristinare dati, esiti, cache e giornate.
  6) "Esporta CSV" genera ritiri_export_YYYY-MM-DD.csv con le colonne originali
     più quelle aggiunte dall'app (UTF-8 con BOM, separatore virgola, campi
     quotati), pronto per il reimporto nel gestionale.

  NOTE TECNICHE
  - Nessuna risorsa esterna, nessun font remoto, nessun framework.
  - Le chiamate di rete (solo se online) sono verso Nominatim
    (OpenStreetMap) per la geocodifica degli indirizzi e verso OSRM per le
    distanze stradali. Il pulsante "Apri in Maps" apre Apple Maps o Google
    Maps e invia lì l'indirizzo scelto. Offline l'app usa il fallback CAP/città.
  - I dati restano sul dispositivo (localStorage o file .json esportato).
  ============================================================================
-->

<link rel="manifest" href="./manifest.webmanifest">

<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-title" content="Ritiri Demo">
<meta name="application-name" content="Ritiri Demo">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Ritiri Demo · Pianificazione giornaliera</title>
<style>
/* ============================ BASE / RESET ============================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{
  --bg:#f3f1ea;
  --surface:#fffdf9;
  --surface-2:#faf7ef;
  --ink:#17211e;
  --muted:#5b6862;
  --line:#e0dbcf;
  --line-strong:#cfc8b8;
  --accent:#0f6b5a;
  --accent-dark:#0a4e41;
  --accent-soft:#e2f1eb;
  --green:#1c7a4d;
  --green-soft:#e5f4ea;
  --yellow:#8f5b0d;
  --yellow-soft:#fdf2d8;
  --red:#a83227;
  --red-soft:#fbe9e6;
  --blue:#255a9e;
  --blue-soft:#e7effb;
  --nav-h:66px;
  --radius:16px;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 7px 20px rgba(20,30,25,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html,body{min-height:100%}
body{
  margin:0;
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  color:var(--ink);
  background:
    radial-gradient(1100px 500px at 100% -10%, #e8efe8 0%, transparent 60%),
    var(--bg);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
body.storage-blocked{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px)}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0}
svg{display:inline-block;vertical-align:middle;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid rgba(15,107,90,.35);outline-offset:2px}

/* ============================ HEADER ============================ */
.app-header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(155deg,#0e3d33 0%,#0a2c26 68%,#08241f 100%);
  color:#f7f3e7;
  padding:calc(9px + env(safe-area-inset-top)) 14px 11px;
  box-shadow:0 2px 14px rgba(0,0,0,.16);
}
.header-inner{max-width:720px;margin:0 auto}
.header-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:850;letter-spacing:-.02em;line-height:1.1}
.brand-mark{
  width:30px;height:30px;border-radius:10px;
  background:linear-gradient(145deg,#f0c568,#d99b31);
  color:#22300f;display:grid;place-items:center;
  font-size:17px;font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.header-date{font-size:16px;color:#c6d7d0;margin-top:3px;font-weight:550}
.header-stats{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-bottom:1px}
.stat-chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:16px;font-weight:750;line-height:1.15;
  padding:4px 10px;border-radius:999px;white-space:nowrap;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);
  color:#eef4ef;
}
.stat-chip.domani{background:rgba(77,131,212,.22);border-color:rgba(142,181,240,.28)}

/* ============================ LAYOUT ============================ */
main{max-width:720px;margin:0 auto;padding:14px 14px 28px}
.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 1px 12px}
.view-head h1{font-size:27px;line-height:1.1;letter-spacing:-.03em;font-weight:850}
.view-sub{font-size:16px;color:var(--muted);font-weight:600;text-align:right}
.section{margin-bottom:18px}
.panel{
  background:linear-gradient(160deg,var(--surface) 0%,#fbf7ec 100%);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.panel-title{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.panel-title svg{width:18px;height:18px}
.panel-sub{color:var(--muted);font-size:16px}
.empty{
  background:rgba(255,253,249,.7);
  border:1px dashed var(--line-strong);
  border-radius:16px;
  padding:22px 16px;
  text-align:center;
  color:var(--muted);
}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.empty .btn{margin-top:4px}

/* ============================ BOTTOM NAV ============================ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,253,248,.96);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -5px 20px rgba(20,30,25,.07);
}
.nav-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav-btn{
  min-height:var(--nav-h);
  border:0;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#69756f;font-size:16px;font-weight:700;padding:6px 2px;position:relative;
}
.nav-btn svg{width:23px;height:23px}
.nav-btn[aria-current="page"]{color:var(--accent)}
.nav-btn[aria-current="page"]::before{
  content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 5px 5px;
  background:var(--accent);
}
.nav-btn:active{background:rgba(15,107,90,.06)}

/* ============================ BUTTONS ============================ */
.btn{
  min-height:48px;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid transparent;
  background:var(--accent);
  color:#fff;
  font-weight:750;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  text-align:center;line-height:1.15;
  transition:transform .08s ease, background .15s ease;
}
.btn svg{width:19px;height:19px}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-call{background:linear-gradient(160deg,#19825c,#126b4b);box-shadow:0 4px 12px rgba(25,130,92,.2);width:100%}
.btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost{background:#efebe1;color:#39463f;border-color:#e3ddcf}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{min-height:44px;padding:8px 10px;font-size:16px;flex:1;border-radius:11px}
.btn-call-soft{background:var(--green-soft);color:#145c3a;border-color:#c4e2d2}
.btn-block{width:100%}
.btn-confirm{
  width:100%;min-height:56px;font-size:18px;border-radius:14px;
  background:linear-gradient(160deg,#0f7a5d,#0b5c47);
  box-shadow:0 6px 16px rgba(15,122,93,.28);
}
.link-btn{
  border:0;background:none;color:var(--accent);font-weight:700;
  padding:4px 0;min-height:44px;display:inline-flex;align-items:center;gap:5px;text-align:left;
}
.link-btn svg{width:17px;height:17px}

/* ============================ SUMMARY / COUNTERS ============================ */
.summary-big{font-size:32px;font-weight:900;letter-spacing:-.045em;line-height:1.05}
.summary-big span{font-size:20px;font-weight:750;color:var(--muted);letter-spacing:0}
.summary-next{margin-top:6px;color:var(--muted);line-height:1.35}
.summary-next strong{color:var(--ink)}
.summary-next .nx-addr{display:block;color:var(--muted)}
.progress{height:9px;border-radius:999px;background:#e7e2d6;overflow:hidden;margin-top:11px}
.progress > i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#1a8061,#31ac81);transition:width .4s ease}
.plan-counter{display:flex;align-items:center;gap:14px}
.plan-number{font-size:46px;font-weight:900;line-height:.95;letter-spacing:-.055em;white-space:nowrap}
.plan-number small{font-size:22px;color:var(--muted);font-weight:750;letter-spacing:0}
.plan-caption{color:var(--muted);line-height:1.3}
.plan-caption strong{display:block;color:var(--ink);font-size:17px}
.geo-note{
  margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);
  color:var(--muted);font-size:16px;display:flex;align-items:center;gap:6px;
}
.geo-note svg{width:16px;height:16px}
.spinner{
  width:15px;height:15px;border-radius:50%;
  border:2px solid #cfd8d3;border-top-color:var(--accent);
  animation:spin .8s linear infinite;flex:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
.plan-list{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.plan-item{
  display:flex;align-items:center;gap:9px;
  background:#fff;border:1px solid #cbdaf2;border-left:4px solid var(--blue);
  border-radius:11px;padding:7px 9px;min-height:48px;
}
.plan-num{
  width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-weight:850;font-size:16px;flex:none;
}
.plan-item-name{flex:1;min-width:0;font-weight:700;line-height:1.2}
.plan-item-name small{display:block;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-remove{
  min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--red);font-weight:800;font-size:18px;
}
.route-list{list-style:none;display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}
.route-item{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #cbdaf2;border-radius:11px;padding:7px 9px;min-height:48px}
.route-item .r-num{width:27px;height:27px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:850;font-size:16px;flex:none}
.route-item .r-name{font-weight:700;min-width:0;flex:1;line-height:1.2}
.route-item .r-name small{display:block;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.distance-panel{
  background:linear-gradient(160deg,#fff,#f8f9f5);
  border:1px solid var(--line);border-radius:16px;
  padding:12px;margin:10px 0 14px;box-shadow:var(--shadow);
}
.distance-panel.compact{padding:10px 12px;margin:8px 0 10px}
.distance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px}
.distance-stat{
  background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:8px;min-width:0;
}
.distance-stat b{display:block;font-size:19px;letter-spacing:-.02em;line-height:1.1;color:var(--ink);overflow-wrap:anywhere}
.distance-stat span{display:block;color:var(--muted);font-size:16px;line-height:1.15;margin-top:3px}
.distance-note{color:var(--muted);line-height:1.3;margin-top:8px}
.distance-note strong{color:var(--ink)}
.distance-summary-line{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  color:var(--muted);
}
.distance-summary-line strong{color:var(--ink);font-size:18px;white-space:nowrap}
.distance-total{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:8px 0 2px;padding-top:8px;border-top:1px solid var(--line);
}
.distance-total span{color:var(--muted);font-weight:650}
.distance-total strong{font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.leg-list{list-style:none;margin:8px 0 0;display:flex;flex-direction:column;gap:5px}
.leg-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:7px 9px;line-height:1.2;
}
.leg-route{min-width:0;color:#3f4d47;overflow-wrap:anywhere}
.leg-route b{font-weight:800;color:var(--ink)}
.leg-row strong{white-space:nowrap;color:var(--accent-dark);font-size:16px}
.leg-row strong.unknown{color:var(--muted);font-weight:600}
.route-leg{
  list-style:none;display:flex;align-items:center;gap:8px;
  padding:1px 0 1px 36px;color:var(--muted);font-weight:650;
}
.route-leg::before{content:"↓";color:var(--accent);font-weight:850}
.route-leg strong{color:var(--accent-dark)}
.distance-details summary{
  min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  cursor:pointer;list-style:none;font-weight:800;color:var(--ink);
}
.distance-details summary::-webkit-details-marker{display:none}
.distance-details summary::after{content:"+";color:var(--accent);font-weight:850;font-size:18px}
.distance-details[open] summary::after{content:"−"}
.distance-details .distance-body{padding-top:4px}
.candidate-distance{margin:0 0 10px}
.candidate-distance .distance-note{font-size:16px}
.candidate-label{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:16px;font-weight:750;color:var(--accent-dark);
  margin:6px 2px 8px;
}
.candidate-label .distance{color:var(--muted);font-weight:600;text-align:right}
.counter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counter{
  min-height:70px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);padding:8px;text-align:left;
  display:flex;flex-direction:column;justify-content:center;line-height:1.1;
}
.counter b{display:block;font-size:23px;letter-spacing:-.03em}
.counter span{display:block;font-size:16px;color:var(--muted);line-height:1.15;margin-top:2px}
.counter.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.counter.active span{color:var(--accent-dark);font-weight:700}
.recall-chip{
  width:100%;margin-top:8px;min-height:44px;border:1px solid #ecd9ae;border-radius:11px;
  background:var(--yellow-soft);color:var(--yellow);font-weight:750;padding:7px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.recall-chip.active{box-shadow:0 0 0 1px var(--yellow) inset}

/* ============================ CARDS ============================ */
.card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-left:5px solid #b9b3a6;
  border-radius:var(--radius);
  padding:13px;
  box-shadow:var(--shadow);
  margin-bottom:10px;
  overflow:hidden;
}
.card.is-selected{border-color:#bfd2f0;border-left-color:var(--blue);box-shadow:0 0 0 2px rgba(37,90,158,.07),var(--shadow)}
.card.just-touched{animation:cardPulse .55s ease-out}
@keyframes cardPulse{0%{transform:scale(.992);background:#f4faf6}55%{transform:scale(1.004)}100%{transform:scale(1);background:var(--surface)}}
.card.state-ritirato,.card.state-gia_riconsegnato{border-left-color:var(--green)}
.card.state-appuntamento{border-left-color:var(--blue)}
.card.state-non_risponde,.card.state-da_richiamare{border-left-color:#c28a2a}
.card.state-fuori_zona,.card.state-cambio_fuori{border-left-color:var(--red)}
.card.state-cambio_zona{border-left-color:#7a8f86}
.card-index{
  width:28px;height:28px;border-radius:50%;flex:none;margin-top:2px;
  background:#f0ece1;color:#5a665f;font-size:16px;font-weight:800;
  display:grid;place-items:center;border:1px solid #e2ddcf;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-title-wrap{min-width:0;flex:1}
.card-title{font-size:20px;font-weight:850;letter-spacing:-.02em;line-height:1.18;overflow-wrap:anywhere}
.card-meta{font-size:16px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.status-pill{
  display:inline-flex;align-items:center;
  font-size:16px;font-weight:750;line-height:1.15;
  padding:4px 9px;border-radius:999px;white-space:normal;overflow-wrap:anywhere;
  border:1px solid #ded8ca;background:#f3efe6;color:#4d5a54;
  flex:none;max-width:48%;text-align:center;line-height:1.15;
}
.tone-green{background:var(--green-soft);color:#145c3a;border-color:#c3e2d1}
.tone-yellow{background:var(--yellow-soft);color:#77490a;border-color:#ecd6a7}
.tone-red{background:var(--red-soft);color:#8c281f;border-color:#f1c8c2}
.tone-blue{background:var(--blue-soft);color:#1f4b87;border-color:#c9d8f0}
.tone-neutral{background:#f0ece2;color:#4e5a54;border-color:#dfd9ca}

/* ============================ BADGES ============================ */
.badges{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:9px 0 2px}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:16px;line-height:1.15;font-weight:650;
  padding:4px 8px;border-radius:8px;
  background:#f1ede3;border:1px solid #e1dbcd;color:#4e5b55;
}
button.badge{font-weight:700}
.badge svg{width:14px;height:14px}
button.badge{min-height:44px;padding:9px 10px;border-radius:10px}
.badge-warn{background:var(--yellow-soft);border-color:#ecd5a5;color:#7b4c0b}
.badge-danger{background:var(--red-soft);border-color:#f0c7c1;color:#8c281f}
.badge-blue{background:var(--blue-soft);border-color:#c9d8f0;color:#1f4b87}
.badge-green{background:var(--green-soft);border-color:#c3e2d1;color:#145c3a}
.badge-edit{background:#eef4ff;border-color:#c9d8f0;color:#255a9e}
.badge-recall{background:var(--yellow-soft);border-color:#ecd5a5;color:#7b4c0b}
.mini-mark{font-size:16px;font-weight:650;color:#255a9e;background:#e7effb;border-radius:6px;padding:1px 5px;margin-left:4px}

/* ============================ ADDRESS / PHONE / DEVICES ============================ */
.address-block{display:flex;align-items:flex-start;gap:8px;margin:10px 0 8px;min-width:0}
.address-block > svg{width:20px;height:20px;color:#68766f;margin-top:2px}
.address-block strong{display:block;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.address-block span{display:block;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.address-block.small{margin:8px 0}
.maps-link{
  display:inline-flex;align-items:center;gap:7px;
  min-height:44px;padding:6px 10px;margin:2px 0 8px;
  border-radius:10px;background:var(--blue-soft);border:1px solid #c9d8f0;
  color:#1f4b87;font-weight:700;text-decoration:none;line-height:1.15;
}
.maps-link svg{width:18px;height:18px}
.maps-link .maps-ext{font-weight:800;color:#5b6b7c;margin-left:2px}
.maps-link:active{transform:scale(.98)}
.original-note{
  background:#f4f7fd;border:1px solid #d5e1f5;border-radius:10px;
  padding:8px 10px;margin:8px 0;color:#3e4d61;line-height:1.35;font-size:16px;
}
.original-note strong{color:#253a58}
.call-block{display:flex;flex-direction:column;gap:7px;margin:10px 0 4px}
.phone-link{
  min-height:48px;display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:12px;
  background:var(--green-soft);color:#145c3a;border:1px solid #c3e2d1;
  font-weight:750;line-height:1.2;
}
.phone-link svg{width:19px;height:19px}
.phone-link.secondary{background:#f6f3ea;color:#3f4d46;border-color:var(--line);font-weight:650}
.phone-link.secondary small{color:var(--muted);font-weight:500}
.devices{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
.devices-title{font-weight:800;font-size:16px;color:#3b4843;display:flex;align-items:center;gap:6px;margin-bottom:3px}
.devices-title span{font-weight:600;color:var(--muted)}
.device{padding:5px 0;border-bottom:1px dashed #ece7db}
.device:last-child{border-bottom:0}
.device-name{display:block;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.device-meta{display:block;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}

/* ============================ OUTCOMES ============================ */
.outcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.outcome-btn{
  min-height:50px;padding:8px 9px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);font-weight:700;line-height:1.15;
  display:flex;align-items:center;justify-content:center;text-align:center;
  transition:transform .08s ease,background .15s ease;
  overflow-wrap:anywhere;
}
.outcome-btn:active{transform:scale(.965)}
.outcome-btn.wide{grid-column:1 / -1}
.esito-appuntamento{background:var(--blue-soft);border-color:#c4d6f1;color:#1d4a86}
.esito-non_risponde,.esito-da_richiamare{background:var(--yellow-soft);border-color:#ead3a2;color:#754809}
.esito-fuori_zona,.esito-cambio_fuori{background:var(--red-soft);border-color:#f0c6c0;color:#8c281f}
.esito-gia_riconsegnato,.esito-ritirato{background:var(--green-soft);border-color:#c1e1cf;color:#135b38}
.esito-cambio_zona{background:#eef2f0;border-color:#d6e0db;color:#3b5a4d}
.esito-da_contattare{background:#f2eee4;border-color:#ddd6c7;color:#4f5b55}
.esito-salta{background:#efede6;border-color:#ddd8ca;color:#55615b;font-weight:650}
.more-outcomes{margin:8px 0 2px}
.more-outcomes summary{
  min-height:44px;display:flex;align-items:center;gap:6px;
  font-weight:700;color:var(--muted);cursor:pointer;list-style:none;
  padding:4px 2px;
}
.more-outcomes summary::-webkit-details-marker{display:none}
.more-outcomes summary::before{content:"+";font-weight:850;font-size:18px;color:var(--accent);width:18px;text-align:center}
.more-outcomes[open] summary::before{content:"−"}
.more-outcomes .outcome-grid{margin-top:2px}
.inline-date{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.inline-date label{font-weight:650;color:var(--muted)}
.inline-date input{
  flex:1;min-width:150px;min-height:46px;padding:7px 10px;
  border:1px solid var(--line-strong);border-radius:10px;background:#fff;
}
.btn-address{
  width:100%;min-height:50px;margin:8px 0 4px;
  background:#f6f4ec;border:1px solid var(--line-strong);color:#37463f;
  font-weight:750;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-address svg{width:18px;height:18px}
.btn-address.needs-fix{
  background:#fff7e6;border:2px solid #d79a2c;color:#6d460b;
  box-shadow:0 0 0 3px rgba(215,154,44,.12);
}
.btn.needs-fix{
  background:#fff7e6;border:2px solid #d79a2c;color:#6d460b;
  box-shadow:0 0 0 2px rgba(215,154,44,.12);
}

/* ============================ NOTES ============================ */
.note-block{margin-top:11px}
.note-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:750;margin-bottom:5px}
.note-status{font-size:16px;font-weight:600;color:var(--green);font-style:normal}
.note-input{
  width:100%;min-height:72px;padding:10px 11px;
  border:1px solid var(--line-strong);border-radius:11px;background:#fff;
  line-height:1.35;resize:vertical;
}
.csv-note{margin-top:8px}
.csv-note summary{min-height:44px;display:flex;align-items:center;font-weight:650;color:var(--muted);cursor:pointer}
.csv-notes{
  white-space:pre-line;background:#faf7ee;border:1px dashed #ded6c2;
  border-radius:10px;padding:9px 10px;color:#4b4a41;overflow-wrap:anywhere;
}

/* ============================ ADDRESS GROUPS ============================ */
.addr-group{margin-bottom:14px}
.addr-group-head{
  display:flex;align-items:center;gap:6px;
  background:#ebe6da;border:1px solid #ddd6c7;border-radius:10px;
  padding:5px 9px;margin-bottom:8px;
  font-size:16px;font-weight:750;color:#4b5a54;line-height:1.2;
}
.addr-group-head svg{width:15px;height:15px;color:#6e7a73}
.addr-group-head .addr-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr-group-head .count{
  margin-left:auto;flex:none;background:#fff;border:1px solid #ddd6c7;
  border-radius:999px;padding:0 7px;font-weight:700;color:#5b6862;
}

/* ============================ TOTAL VIEW ============================ */
.search-wrap{position:relative;margin-bottom:9px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#6d7973}
.search-wrap input{
  width:100%;min-height:50px;padding:10px 12px 10px 39px;
  border:1px solid var(--line-strong);border-radius:12px;background:#fff;
}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.filter-grid select{
  width:100%;min-height:48px;padding:7px 9px;
  border:1px solid var(--line-strong);border-radius:11px;background:#fff;
}
.filter-checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.check-row{
  display:flex;align-items:center;gap:7px;min-height:44px;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:5px 8px;font-weight:600;line-height:1.15;
}
.check-row input{width:21px;height:21px;accent-color:var(--accent);flex:none}
.check-row.wide{grid-column:1 / -1}
.filter-actions{display:flex;gap:8px;margin-top:8px}
.filter-actions .btn{flex:1;min-height:44px;font-size:16px}
.results-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);margin:12px 2px 8px;font-weight:600}
.results-meta strong{color:var(--ink)}
.trow{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid #b9b3a6;
  border-radius:13px;padding:10px;margin-bottom:8px;box-shadow:0 1px 1px rgba(20,30,25,.03);
}
.trow.is-selected{border-color:#bfd2f0;border-left-color:var(--blue);box-shadow:0 0 0 2px rgba(37,90,158,.07)}
.trow.state-ritirato,.trow.state-gia_riconsegnato{border-left-color:var(--green)}
.trow.state-appuntamento{border-left-color:var(--blue)}
.trow.state-non_risponde,.trow.state-da_richiamare{border-left-color:#c28a2a}
.trow.state-fuori_zona,.trow.state-cambio_fuori{border-left-color:var(--red)}
.trow.just-touched{animation:cardPulse .55s ease-out}
.trow-main{display:flex;align-items:flex-start;gap:8px}
.trow-toggle{
  flex:1;min-width:0;min-height:44px;border:0;background:none;padding:0;text-align:left;
}
.trow-name{display:block;font-weight:800;font-size:17px;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.trow-meta{display:block;color:var(--muted);line-height:1.25;margin-top:1px;overflow-wrap:anywhere}
.trow-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.btn-map{flex:0 0 46px;min-width:46px;max-width:46px;padding:0;background:var(--blue-soft);border-color:#c9d8f0;color:#1f4b87}
.btn-map svg{width:20px;height:20px}
.trow-details{padding-top:9px;margin-top:9px;border-top:1px dashed var(--line);animation:detailsIn .18s ease-out}
@keyframes detailsIn{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}
.trow-details .devices{margin-top:8px}
.trow-details .outcome-grid{margin-top:10px}

/* ============================ SETTINGS ============================ */
.settings-section{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.settings-section h2{font-size:18px;font-weight:850;letter-spacing:-.015em;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.settings-section h2 svg{width:20px;height:20px}
.setting-stack{display:flex;flex-direction:column;gap:8px}
.setting-btn{
  width:100%;min-height:50px;border:1px solid var(--line-strong);border-radius:12px;
  background:#fff;color:var(--ink);font-weight:700;padding:9px 12px;
  display:flex;align-items:center;gap:9px;text-align:left;
}
.setting-btn svg{width:20px;height:20px;color:var(--accent)}
.setting-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.setting-btn.primary svg{color:#fff}
.setting-btn.danger{background:var(--red-soft);border-color:#eec3bd;color:#8c281f}
.setting-btn.danger svg{color:#8c281f}
.setting-btn small{display:block;color:var(--muted);font-weight:500;line-height:1.2;font-size:16px;margin-top:1px}
.setting-btn.primary small{color:#d8ece4}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);line-height:1.3}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);font-weight:600}
.kv strong{text-align:right;font-weight:750;overflow-wrap:anywhere}
.note-box{
  background:#f7f4ea;border:1px solid var(--line);border-radius:12px;
  padding:10px 11px;color:#4b5751;line-height:1.4;
}
.note-box strong{color:var(--ink)}
.status-ok{color:var(--green);font-weight:750}
.status-bad{color:var(--red);font-weight:750}
details.help{margin-top:8px}
details.help summary{min-height:44px;display:flex;align-items:center;font-weight:650;color:var(--muted);cursor:pointer}
details.help .note-box{margin-top:4px}

/* ============================ MODAL ============================ */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  background:rgba(8,20,16,.56);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:720px;max-height:92vh;overflow:auto;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 50px rgba(0,0,0,.3);
  animation:sheetUp .24s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:640px){
  .modal-backdrop{align-items:center;padding:20px}
  .modal{border-radius:20px;max-width:580px;padding-bottom:18px}
}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.modal-head h2{font-size:21px;font-weight:850;letter-spacing:-.02em;line-height:1.2}
.modal-close{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:#4f5c56;display:grid;place-items:center;flex:none;
  font-size:22px;line-height:1;
}
.modal-sub{color:var(--muted);line-height:1.35;margin-bottom:8px}
.modal-original{
  background:#f7f4ea;border:1px dashed var(--line-strong);border-radius:10px;
  padding:8px 10px;color:#4d5a54;line-height:1.35;margin:8px 0;
}
.transfer-note{
  background:#fff7e6;border:1px solid #e8d3a0;border-radius:10px;
  padding:9px 10px;color:#6d460b;line-height:1.35;margin:8px 0;
}
.field{display:block;margin:11px 0}
.field > span{display:block;font-weight:700;margin-bottom:5px}
.field input{
  width:100%;min-height:50px;padding:9px 11px;
  border:1px solid var(--line-strong);border-radius:11px;background:#fff;
}
.field input:focus,.field input:focus-visible{border-color:var(--accent)}
.field-hint{display:block;color:var(--muted);margin-top:4px;line-height:1.3}
.form-error{
  background:var(--red-soft);color:#8c281f;border:1px solid #eec3bd;
  border-radius:10px;padding:8px 10px;margin:8px 0;font-weight:650;
}
.modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.issue-list{margin:6px 0 0 18px;color:#6d460b;line-height:1.35}
.issue-list li{margin:2px 0}

/* ============================ TOAST / BANNER ============================ */
.persist-banner{
  position:fixed;left:0;right:0;z-index:49;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:#fff2d2;color:#5c430f;border-top:1px solid #ead4a1;
  padding:7px 14px;text-align:center;font-size:16px;font-weight:650;line-height:1.25;
}
.toast{
  position:fixed;left:50%;z-index:200;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  max-width:calc(100% - 28px);width:max-content;
  background:#143b32;color:#fff;border:1px solid rgba(255,255,255,.1);
  padding:10px 15px;border-radius:12px;text-align:center;font-weight:650;
  box-shadow:0 10px 34px rgba(0,0,0,.28);transition:opacity .2s ease,transform .2s ease;
  line-height:1.3;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:#7a4c0a}
.toast.err{background:#8e2a22}
body.storage-blocked .toast{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 66px)}

/* ============================ RESPONSIVE / MOTION ============================ */
@media(min-width:640px){
  .outcome-grid{grid-template-columns:repeat(4,1fr)}
  .filter-checks{grid-template-columns:repeat(4,1fr)}
  .filter-checks .check-row.wide{grid-column:auto}
}
@media(max-width:359px){
  .counter-grid{grid-template-columns:repeat(2,1fr)}
  .filter-grid{grid-template-columns:1fr}
  .filter-checks{grid-template-columns:1fr}
  .filter-checks .check-row.wide{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

function clean(value) {
  return value === null || value === undefined ? '' : String(value).replace(/\u0000/g, '').trim();
}

function normAddress(value) {
  return clean(value).replace(/\s+/g, ' ');
}

function isValidCap(value) {
  return /^\d{5}$/.test(clean(value));
}

function hashString(value) {
  let h = 5381;
  const str = String(value);
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(36);
}

function escapeHtml(value) {
  return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}
const esc = escapeHtml;

function parseJSON(value, fallback) {
  if (!value) return fallback;
  try {
    const parsed = JSON.parse(value);
    return parsed === null ? fallback : parsed;
  } catch (err) {
    return fallback;
  }
}

function asStringArray(value) {
  return Array.isArray(value) ? value.filter(item => typeof item === 'string') : [];
}

function capitalize(value) {
  const str = String(value || '');
  return str ? str.charAt(0).toLocaleUpperCase('it-IT') + str.slice(1) : '';
}

function capWord(word) {
  if (!word) return '';
  return word.charAt(0).toLocaleUpperCase('it-IT') + word.slice(1);
}

/* Titolo leggibile per città e nomi, con particelle italiane minuscole. */
function titleCaseCity(raw) {
  const lower = clean(raw).toLowerCase().replace(/\s+/g, ' ');
  if (!lower) return '';
  return lower.split(' ').map((word, index) => {
    if (word.includes("'")) {
      return word.split("'").map((part, partIndex) => {
        if (!part) return '';
        if (partIndex === 0 && part === 'd' && index > 0) return part;
        return capWord(part);
      }).join("'");
    }
    if (index > 0 && CITY_PARTICLES.has(word)) return word;
    return capWord(word);
  }).join(' ');
}

function formatName(raw) {
  const lower = clean(raw).toLowerCase().replace(/\s+/g, ' ');
  if (!lower) return '';
  return lower.split(' ').map((word, index) => {
    if (word.includes("'")) {
      return word.split("'").map((part, partIndex) => {
        if (!part) return '';
        if (partIndex === 0 && part === 'd' && index > 0) return part;
        return capWord(part);
      }).join("'");
    }
    if (index > 0 && NAME_PARTICLES.has(word)) return word;
    return capWord(word);
  }).join(' ');
}

function cityKey(value) {
  return clean(value)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function normalizeSearch(value) {
  return clean(value)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/*
 * Normalizzazione telefono:
 * - rimuove prefisso internazionale 0039 o +39
 * - rimuove spazi, trattini, punti e qualsiasi carattere non numerico
 * - memorizza solo cifre; il numero è "sospetto" (non bloccante) se la
 *   lunghezza non è 10 (mobile/fisso italiano) né 6-8 (fisso breve).
 */
function normalizePhone(raw) {
  let digits = clean(raw).replace(/[^\d+]/g, '');
  digits = digits.replace(/^\+39/, '').replace(/^0039/, '');
  return digits.replace(/\D/g, '');
}

function phoneIsSuspicious(digits) {
  const len = String(digits || '').length;
  return len > 0 && len !== 10 && !(len >= 6 && len <= 8);
}

function formatPhone(digits) {
  const d = String(digits || '');
  if (d.length === 10) return d.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1 $2 $3');
  if (d.length >= 6 && d.length <= 8) return d.replace(/^(\d{3,4})(\d{3,4})$/, '$1 $2');
  return d;
}

/*
 * Telefoni secondari nelle note: usa la regex richiesta, con parola chiave
 * separata per mobile (3xx) e fisso (0xx). I numeri trovati vengono
 * normalizzati e deduplicati rispetto al telefono principale.
 */
function extractSecondaryPhones(notes, primary) {
  const text = String(notes || '');
  const re = /\b(?:\+?39)?[\s\-]?3\d{2}[\s\-]?\d{6,7}\b|\b0\d{1,3}[\s\/\-]?\d{5,8}\b/g;
  const found = [];
  let match;
  while ((match = re.exec(text)) !== null) {
    const number = normalizePhone(match[0]);
    if (number && number !== primary && !found.includes(number)) found.push(number);
  }
  return found;
}

function pad2(value) {
  return String(value).padStart(2, '0');
}

function isoDate(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function todayISO() { return isoDate(new Date()); }

function tomorrowISO() {
  const date = new Date();
  date.setDate(date.getDate() + 1);
  return isoDate(date);
}

function nowISO() { return new Date().toISOString(); }

function parseLocalDate(iso) {
  const parts = String(iso || '').split('-').map(Number);
  if (parts.length !== 3 || !parts[0]) return null;
  const date = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1, 12, 0, 0);
  return isNaN(date.getTime()) ? null : date;
}

function formatLongDate(iso) {
  const date = parseLocalDate(iso);
  return date ? date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
}

function formatShortDate(iso) {
  if (!iso) return '';
  const date = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? parseLocalDate(iso) : new Date(iso);
  if (!date || isNaN(date.getTime())) return iso;
  return date.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateTime(iso) {
  if (!iso) return '';
  const date = new Date(iso);
  if (isNaN(date.getTime())) return iso;
  return date.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function sleep(ms) {

}

function haptic() {

  } catch (err) { /* iOS ignora: nessun problema */ }
}

function showToast(message, kind) {
